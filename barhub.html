function AsistEmpleado({historial,empSel,setEmpSel,anio,loading,empleados}){
  if(loading) return <div style={{padding:40,textAlign:"center",color:C.ink4}}>Cargando...</div>;
  if(!empleados||!empleados.length) return <div style={{padding:40,textAlign:"center",color:C.ink4}}>Sin empleados en el catálogo.</div>;
  var emp=empleados.find(function(e){return e.nombre===empSel;})||empleados[0];
  var col=AREA_COLOR[emp.area]||C.ink4;
  var registros=Object.keys(historial).sort().filter(function(k){return parseSemana(k).anio===anio;}).map(function(k){
    var s=parseSemana(k);
    var r=(historial[k]||[]).find(function(x){return (x.nombre||"").toLowerCase()===emp.nombre.toLowerCase();});
    var hb=r?(r.horas_reales||0):null;
    var p=hb!=null?Math.min(100,hb/emp.hrsProg*100):null;
    return {sem:s,hb:hb,dias:r?(r.dias_asistidos||0):null,pct:p};
  });
  var totalHrs=registros.reduce(function(a,r){return a+(r.hb||0);},0);
  var semsPresente=registros.filter(function(r){return r.hb!=null&&r.hb>0;}).length;
  var promPct=semsPresente>0?registros.filter(function(r){return r.pct!=null;}).reduce(function(a,r){return a+r.pct;},0)/semsPresente:0;
  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      {empleados.filter(function(e){return !e.adminFijo;}).map(function(e){
        var c=AREA_COLOR[e.area]||C.ink4;
        var sel=e.nombre===empSel;
        return <button key={e.nombre} onClick={function(){setEmpSel(e.nombre);}} style={{padding:"5px 12px",borderRadius:20,border:"1px solid "+(sel?c:C.border),background:sel?c+"22":"none",color:sel?c:C.ink4,fontSize:10,cursor:"pointer",fontWeight:sel?700:400}}>{e.nombre}</button>;
      })}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
      <KPI label={"Total hrs "+anio} value={totalHrs+"h"} color={col}/>
      <KPI label="Semanas presentes" value={semsPresente} color={C.blue}/>
      <KPI label="Promedio cumplimiento" value={promPct.toFixed(1)+"%"} color={promPct>=90?C.green:promPct>=70?C.amber:C.red}/>
      <KPI label="Hrs prog/sem" value={emp.hrsProg+"h"} color={C.ink3}/>
    </div>
    <Card title={emp.nombre+" · Historial "+anio}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <TH cols={["Semana","Mes","Hrs Prog","Hrs Reales","Días","Cumplimiento","Estado"]}/>
        <tbody>
          {registros.map(function(r,i){return <tr key={i} style={{borderBottom:"1px solid "+C.border,background:i%2===0?"transparent":C.s3+"60"}}>
            <td style={{padding:"8px 10px",fontSize:10,fontFamily:"monospace",color:C.ink3}}>{r.sem.label}</td>
            <td style={{padding:"8px 10px"}}><Badge label={MESES_CORTO[r.sem.mes]} color={C.blue} bg={C.blue+"15"}/></td>
            <td style={{padding:"8px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.ink4}}>{emp.hrsProg}h</td>
            <td style={{padding:"8px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",fontWeight:600,color:r.hb!=null?C.ink:C.ink4}}>{r.hb!=null?r.hb+"h":"—"}</td>
            <td style={{padding:"8px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.ink3}}>{r.dias!=null?r.dias:"—"}</td>
            <td style={{padding:"8px 10px"}}>{r.pct!=null?<BarCump pct={r.pct}/>:<span style={{fontSize:9,color:C.ink4}}>—</span>}</td>
            <td style={{padding:"8px 10px",textAlign:"right"}}><EstBadge hb={r.hb!=null?r.hb:null} hp={emp.hrsProg} adminFijo={false}/></td>
          </tr>;})}
          {!registros.length&&<tr><td colSpan={7} style={{padding:24,textAlign:"center",color:C.ink4,fontSize:10}}>Sin registros para {anio}</td></tr>}
        </tbody>
      </table>
    </Card>
  </div>;
}

function AsistAnual({historial,anio,loading,empleados}){
  if(loading) return <div style={{padding:40,textAlign:"center",color:C.ink4}}>Cargando...</div>;
  var emps=empleados.filter(function(e){return !e.adminFijo;});
  var porMes={};
  Object.keys(historial).forEach(function(k){
    var s=parseSemana(k);
    if(s.anio!==anio) return;
    if(!porMes[s.mes]) porMes[s.mes]=[];
    porMes[s.mes].push(k);
  });
  return <Card title={"Resumen anual · "+anio}>
    <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          <th style={{padding:"8px 10px",textAlign:"left",fontSize:7,fontWeight:700,color:C.ink4,borderBottom:"1px solid "+C.border,minWidth:110}}>Empleado</th>
          {MESES.map(function(m,i){return <th key={i} style={{padding:"8px 6px",textAlign:"center",fontSize:7,fontWeight:700,color:C.ink4,borderBottom:"1px solid "+C.border,minWidth:50}}>{MESES_CORTO[i]}</th>;})}
          <th style={{padding:"8px 10px",textAlign:"right",fontSize:7,fontWeight:700,color:C.ink4,borderBottom:"1px solid "+C.border}}>Anual</th>
        </tr></thead>
        <tbody>
          {emps.map(function(emp,i){
            var col=AREA_COLOR[emp.area]||C.ink4;
            var totalAnual=0;
            return <tr key={i} style={{borderBottom:"1px solid "+C.border,background:i%2===0?"transparent":C.s3+"60"}}>
              <td style={{padding:"8px 10px"}}><div style={{display:"flex",alignItems:"center",gap:7}}><Av n={emp.nombre} c={col} size={20}/><span style={{fontSize:10,fontWeight:600}}>{emp.nombre}</span></div></td>
              {MESES.map(function(m,mi){
                var info=porMes[mi];
                if(!info||!info.length) return <td key={mi} style={{padding:"6px",textAlign:"center"}}><span style={{fontSize:8,color:C.ink4}}>—</span></td>;
                var hrs=0,sems=0;
                info.forEach(function(s){
                  var r=(historial[s]||[]).find(function(x){return (x.nombre||"").toLowerCase()===emp.nombre.toLowerCase();});
                  if(r){hrs+=(r.horas_reales||0);sems++;}
                });
                totalAnual+=hrs;
                var p=sems>0?Math.min(100,hrs/sems/emp.hrsProg*100):0;
                var bg=sems===0?C.s3:p>=90?C.green+"22":p>=70?C.amber+"22":C.red+"22";
                var tc=sems===0?C.ink4:p>=90?C.green:p>=70?C.amber:C.red;
                return <td key={mi} style={{padding:"6px"}}><div style={{background:bg,borderRadius:4,padding:"3px 4px",textAlign:"center"}}>
                  <div style={{fontSize:10,fontFamily:"monospace",fontWeight:700,color:tc}}>{sems>0?hrs+"h":"—"}</div>
                  <div style={{fontSize:6,color:tc}}>{sems>0?p.toFixed(0)+"%":""}</div>
                </div></td>;
              })}
              <td style={{padding:"8px 10px",textAlign:"right",fontSize:12,fontFamily:"monospace",fontWeight:800,color:C.green}}>{totalAnual>0?totalAnual+"h":"—"}</td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>
  </Card>;
}

// ── TAB VENTAS ────────────────────────────────────────────────────────────────
function TabVentas({data,grupos,semana,ventasProp,semPropKey,mobile}){
  const [expandido,setExpandido]=useState(null);
  const [detalleKey,setDetalleKey]=useState(null);
  const [detalleCache,setDetalleCache]=useState({});
  const [detalleLoading,setDetalleLoading]=useState(null);
  const ventasM=data.ventas||[];
  const totalM=ventasM.reduce((a,m)=>a+(m.venta||0),0);

  // ── Colores por grupo ────────────────────────────────────────────────────
  const COLORES_G={alimentos:C.amber,cerveza:C.blue,bebidas:C.purple,mixolog:C.green,litros:C.teal,mezclador:C.teal,seltzers:C.pink};
  const colorG=n=>{const s=n.toLowerCase();for(const[k,v]of Object.entries(COLORES_G)){if(s.includes(k))return v;}return C.ink4;};

  // ── Separar grupos principales vs subgrupos ──────────────────────────────
  const gruposPpal=(grupos||[]).filter(g=>!g.es_subgrupo);
  const todosSubgrupos=(grupos||[]).filter(g=>g.es_subgrupo);
  const esCartones=g=>g.grupo.toLowerCase().includes('carton');

  // Para cada grupo principal: calcular venta desde SUMA DE SUBGRUPOS (más preciso).
  // Si no tiene subgrupos, usar venta del principal.
  // Cartones → siempre van a Cerveza aunque grupo_padre sea Bebidas.
  const gruposConTotales=gruposPpal.map(g=>{
    const nombre=g.grupo.toLowerCase();
    const esCerveza=nombre.includes('cerveza');
    // Hijos directos (sin Cartones — éstos se reasignan a Cerveza)
    let hijos=todosSubgrupos.filter(s=>s.grupo_padre?.toLowerCase()===nombre&&!esCartones(s));
    // Cerveza absorbe Cartones de cualquier grupo
    if(esCerveza){
      const cartones=(grupos||[]).filter(x=>esCartones(x)&&x!==g);
      hijos=[...hijos,...cartones];
    }
    // Total = suma de subgrupos si los hay; si no, usar el valor del principal
    const ventaHijos=hijos.reduce((a,h)=>a+(h.venta||0),0);
    const venta=hijos.length>0?ventaHijos:(g.venta||0);
    return{...g,venta,hijos};
  });

  const sortedG=[...gruposConTotales].sort((a,b)=>b.venta-a.venta);
  const totalG=sortedG.reduce((a,g)=>a+g.venta,0);
  const maxV=sortedG[0]?.venta||1;
  const totalArt=(grupos||[]).filter(g=>!g.es_subgrupo).reduce((a,g)=>a+(g.cantidad||0),0);
  const difPct=totalG>0?Math.abs(totalG-totalM)/totalG*100:0;
  const cuadra=difPct<1;

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:mobile?"repeat(2,1fr)":"repeat(4,1fr)",gap:mobile?8:10}}>
        <KPI label="Venta grupos" value={mxnD(totalG)} color={C.green}/>
        <KPI label="Venta meseros" value={mxnD(totalM)} color={C.blue}/>
        <KPI label="Grupos" value={sortedG.length} color={C.purple}/>
        <KPI label="Artículos" value={totalArt.toLocaleString("es-MX")} sub="unidades" color={C.teal}/>
      </div>

      {/* Sin datos */}
      {sortedG.length===0&&(
        <div style={{background:C.s2,border:"1px dashed "+C.amber,borderRadius:8,padding:"12px 16px",fontSize:11,color:C.amber,textAlign:"center"}}>
          ⚠ Sin ventas por grupo. Sincroniza Drive para cargar los PDFs.
        </div>
      )}

      {/* Tarjetas de grupos principales */}
      {sortedG.length>0&&(
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <div style={{fontSize:9,fontWeight:700,color:C.ink4,textTransform:"uppercase",letterSpacing:"0.1em"}}>
            Ventas por grupo · {semana.label}
          </div>
          <div style={{display:"grid",gridTemplateColumns:mobile?"repeat(2,1fr)":"repeat(3,1fr)",gap:10}}>
            {sortedG.map(g=>{
              const col=colorG(g.grupo);
              const pct=totalG>0?g.venta/totalG*100:0;
              const bw=g.venta/maxV*100;
              const act=expandido===g.grupo;
              return(
                <div key={g.grupo} style={{gridColumn:act&&!mobile?"span 3":"span 1"}}>
                  {/* Tarjeta principal */}
                  <div onClick={()=>setExpandido(act?null:g.grupo)}
                    style={{background:C.s2,border:"1px solid "+(act?col:C.border),borderRadius:act?"10px 10px 0 0":10,padding:"12px 14px",cursor:"pointer",transition:"border-color .15s"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <div style={{width:10,height:10,borderRadius:"50%",background:col,flexShrink:0}}/>
                        <span style={{fontSize:11,fontWeight:700,color:C.ink}}>{g.grupo}</span>
                      </div>
                      <span style={{fontSize:8,color:act?col:C.ink4,fontWeight:700}}>{act?"▲ cerrar":"▼ ver"}</span>
                    </div>
                    <div style={{fontSize:16,fontWeight:800,fontFamily:"monospace",color:col,marginBottom:4}}>{mxnD(g.venta)}</div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                      <span style={{fontSize:9,color:C.ink4}}>{pct.toFixed(1)}% del total</span>
                      {g.hijos.length>0&&<span style={{fontSize:8,color:C.ink4}}>{g.hijos.length} subgrupos</span>}
                    </div>
                    {/* Barra de progreso */}
                    <div style={{background:C.s3,borderRadius:3,height:4}}>
                      <div style={{width:bw+"%",height:"100%",background:col,borderRadius:3,transition:"width .3s"}}/>
                    </div>
                  </div>
                  {/* Subgrupos desplegables */}
                  {act&&g.hijos.length>0&&(
                    <div style={{background:C.s3,border:"1px solid "+col,borderTop:"none",borderRadius:"0 0 10px 10px",overflow:"hidden"}}>
                      <div style={{padding:"6px 14px",background:col+"15",borderBottom:"1px solid "+col+"30"}}>
                        <span style={{fontSize:9,fontWeight:700,color:col,textTransform:"uppercase",letterSpacing:"0.08em"}}>Subgrupos</span>
                      </div>
                      {g.hijos.sort((a,b)=>(b.venta||0)-(a.venta||0)).map((h,i)=>{
                        const hPct=g.venta>0?(h.venta||0)/g.venta*100:0;
                        const dk=g.grupo+"|"+h.grupo;
                        const dAct=detalleKey===dk;
                        const dData=detalleCache[dk];
                        const dLoad=detalleLoading===dk;
                        const abrirDetalle=async()=>{
                          if(dAct){setDetalleKey(null);return;}
                          setDetalleKey(dk);
                          if(dData!==undefined)return;
                          setDetalleLoading(dk);
                          try{
                            const r=await fetch(API+"/api/ventas-grupo/detalle?semana="+encodeURIComponent(data.semanaVentas||semana.key)+"&grupo="+encodeURIComponent(g.grupo),{headers:{"x-app-secret":"BarHub2026"}});
                            const d=await r.json();
                            setDetalleCache(c=>({...c,[dk]:d.ok?d.items:[]}));
                          }catch(e){setDetalleCache(c=>({...c,[dk]:[]}));}
                          setDetalleLoading(null);
                        };
                        return(
                          <div key={i}>
                            <div onClick={abrirDetalle} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 14px",borderBottom:(!dAct&&i<g.hijos.length-1)?"1px solid "+C.border:"none",cursor:"pointer",background:dAct?col+"15":"transparent",transition:"background .15s"}}>
                              <div style={{display:"flex",alignItems:"center",gap:6}}>
                                <div style={{width:4,height:4,borderRadius:"50%",background:col,opacity:dAct?1:0.6}}/>
                                <span style={{fontSize:10,color:dAct?col:C.ink3,fontWeight:dAct?700:400}}>{h.grupo}</span>
                              </div>
                              <div style={{display:"flex",alignItems:"center",gap:8}}>
                                <div style={{textAlign:"right"}}>
                                  <div style={{fontSize:11,fontFamily:"monospace",fontWeight:600,color:C.ink}}>{mxnD(h.venta||0)}</div>
                                  <div style={{fontSize:8,color:C.ink4}}>{hPct.toFixed(1)}%</div>
                                </div>
                                <span style={{fontSize:8,color:col,opacity:0.8}}>{dAct?"▲":"▼"}</span>
                              </div>
                            </div>
                            {dAct&&(
                              <div style={{background:C.s2+"88",borderBottom:i<g.hijos.length-1?"1px solid "+C.border:"none",padding:"8px 14px 10px"}}>
                                {dLoad?(
                                  <div style={{fontSize:10,color:C.ink4,textAlign:"center",padding:"6px 0"}}>Cargando productos...</div>
                                ):dData&&dData.length>0?(
                                  <div style={{display:"flex",flexDirection:"column",gap:3}}>
                                    {[...dData].sort((a,b)=>(b.venta||0)-(a.venta||0)).map((p,pi)=>(
                                      <div key={pi} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                                        <span style={{fontSize:9,color:C.ink3,flex:1}}>{p.producto}</span>
                                        <span style={{fontSize:10,fontFamily:"monospace",color:C.ink,fontWeight:600,flexShrink:0}}>{mxnD(p.venta||0)}</span>
                                      </div>
                                    ))}
                                    <div style={{marginTop:5,paddingTop:5,borderTop:"1px solid "+col+"30",display:"flex",justifyContent:"space-between"}}>
                                      <span style={{fontSize:9,color:C.ink4,fontWeight:700}}>Total detalle</span>
                                      <span style={{fontSize:10,fontFamily:"monospace",color:col,fontWeight:700}}>{mxnD(dData.reduce((a,p)=>a+(p.venta||0),0))}</span>
                                    </div>
                                  </div>
                                ):(
                                  <div style={{fontSize:10,color:C.ink4,textAlign:"center",padding:"6px 0"}}>
                                    {dData!==undefined?"Sin productos para este subgrupo":""}
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                  {act&&g.hijos.length===0&&(
                    <div style={{background:C.s3,border:"1px solid "+col,borderTop:"none",borderRadius:"0 0 10px 10px",padding:"10px 14px",fontSize:10,color:C.ink4,textAlign:"center"}}>
                      Sin subgrupos registrados
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Validación de totales */}
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",background:C.s2,borderRadius:8,border:"1px solid "+(cuadra?C.greenDim:C.amber+"60")}}>
            <span style={{fontSize:14}}>{cuadra?"✓":"⚠"}</span>
            <div style={{flex:1}}>
              <span style={{fontSize:10,color:C.ink3}}>Grupos: <b style={{fontFamily:"monospace",color:C.green}}>{mxnD(totalG)}</b></span>
              <span style={{fontSize:10,color:C.ink3,margin:"0 8px"}}>vs</span>
              <span style={{fontSize:10,color:C.ink3}}>Meseros: <b style={{fontFamily:"monospace",color:C.blue}}>{mxnD(totalM)}</b></span>
            </div>
            <span style={{fontSize:9,color:cuadra?C.green:C.amber,fontWeight:700}}>
              {cuadra?"Cuadran":"Dif. "+mxnD(Math.abs(totalG-totalM))}
            </span>
          </div>
        </div>
      )}

      {/* Ventas por mesero */}
      <Card title={"Ventas por mesero · "+semana.label}>
        {ventasM.length===0?<div style={{color:C.ink4,fontSize:10,padding:16,textAlign:"center"}}>Sin datos de meseros esta semana.</div>:(
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <TH cols={["Mesero","Venta","Moche","Prop.T"]}/>
            <tbody>
              {ventasM.map((m,i)=>{
                const mc=(m.venta||0)*0.045;
                const mp=(ventasProp||[]).find(p=>p.nombre?.toLowerCase()===m.nombre?.toLowerCase());
                const pt=mp?.propina??mp?.prop_tarjeta??0;
                return(
                  <tr key={i} style={{borderBottom:"1px solid "+C.border,background:i%2===0?"transparent":C.s3+"60"}}>
                    <td style={{padding:"9px 10px"}}><div style={{display:"flex",alignItems:"center",gap:8}}><Av n={m.nombre} c={C.blue}/><span style={{fontSize:11,fontWeight:600}}>{m.nombre}</span></div></td>
                    <td style={{padding:"9px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.green,fontWeight:700}}>{mxnD(m.venta||0)}</td>
                    <td style={{padding:"9px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.red}}>({mxnD(mc)})</td>
                    <td style={{padding:"9px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.teal}}>{pt>0?mxnD(pt):"-"}</td>
                  </tr>
                );
              })}
              <tr style={{borderTop:"2px solid "+C.border,background:C.s3}}>
                <td style={{padding:"9px 10px",fontSize:9,fontWeight:700,color:C.ink4}}>TOTAL</td>
                <td style={{padding:"9px 10px",textAlign:"right",fontSize:12,fontFamily:"monospace",fontWeight:800,color:C.green}}>{mxnD(totalM)}</td>
                <td style={{padding:"9px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.red}}>({mxnD(totalM*0.045)})</td>
                <td style={{padding:"9px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.teal}}>{mxnD((ventasProp||[]).reduce((a,v)=>a+(v.propina??v.prop_tarjeta??0),0))}</td>
              </tr>
            </tbody>
          </table>
        )}
      </Card>
    </div>
  );
}

// ── MÓDULO DE REPORTES ──────────────────────────────────────────────────────
function generarReporteHTML(data, semana, rows, grupos, seccion, empFiltro) {
  rows = rows || [];
  var ts=0,tm=0,tt=0,tp=0,tcm=0,tNet=0;
  rows.forEach(function(r){ ts+=r.sueldo; tm+=r.moche; tt+=r.propTarjeta; tp+=r.propPiso; tcm+=r.comida; tNet+=r.totalNeto; });
  var sorted = (grupos||[]).slice().sort(function(a,b){return (b.venta||0)-(a.venta||0);});
  var totalG = sorted.reduce(function(a,g){return a+(g.venta||0);},0);
  var incluyeTodo = seccion==="todo";

  var css = "body{font-family:Arial,sans-serif;font-size:12px;color:#111;margin:0;padding:20px}" +
    "h1{font-size:20px;font-weight:800;color:#166534;margin-bottom:4px}" +
    "h2{font-size:14px;font-weight:700;color:#333;margin:20px 0 8px;border-bottom:2px solid #eee;padding-bottom:4px}" +
    ".meta{font-size:10px;color:#666;margin-bottom:16px}" +
    "table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:11px}" +
    "th{padding:6px 10px;background:#f0fdf4;text-align:left;font-weight:700;font-size:9px;text-transform:uppercase;border-bottom:2px solid #166534}" +
    "th.r,td.r{text-align:right}" +
    "td{padding:6px 10px;border-bottom:1px solid #eee}" +
    "tr:nth-child(even){background:#f9fafb}" +
    "tr.admin td{background:#f0fdf4}" +
    ".total{font-weight:800;font-size:13px;color:#166534}" +
    ".neg{color:#dc2626}.pos{color:#16a34a}" +
    ".kpi{display:inline-block;padding:10px 16px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;margin:0 8px 8px 0;min-width:130px}" +
    ".kpi-label{font-size:9px;text-transform:uppercase;color:#6b7280;margin-bottom:2px}" +
    ".kpi-val{font-size:16px;font-weight:800}";

  var fecha = new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"long",year:"numeric"});
  var body = "<div style='display:flex;justify-content:space-between;margin-bottom:16px'>" +
    "<div><h1>Soja Restoran &#183; Mexicali</h1>" +
    "<div class='meta'>Reporte semanal &#183; Semana " + semana.key + " &#183; " + fecha + "</div></div>" +
    "<div style='text-align:right;font-size:10px;color:#6b7280'>BarHub FP&amp;A v2.0</div></div>";

  if (incluyeTodo || seccion==="resumen") {
    body += "<h2>Resumen Ejecutivo</h2><div>" +
      "<div class='kpi'><div class='kpi-label'>Venta total</div><div class='kpi-val'>" + mxnD(totalG) + "</div></div>" +
      "<div class='kpi'><div class='kpi-label'>N&oacute;mina neta</div><div class='kpi-val'>" + mxnD(tNet) + "</div></div>" +
      "<div class='kpi'><div class='kpi-label'>Sueldos brutos</div><div class='kpi-val'>" + mxnD(ts) + "</div></div>" +
      "<div class='kpi'><div class='kpi-label'>Moche total</div><div class='kpi-val'>" + mxnD(tm) + "</div></div>" +
      "</div>";
  }

  if (incluyeTodo || seccion==="nomina") {
    body += "<h2>N&oacute;mina Semanal</h2><table>" +
      "<tr><th>Empleado</th><th>Area</th><th class='r'>Dias</th><th class='r'>Sueldo</th><th class='r'>Moche</th><th class='r'>Prop.T</th><th class='r'>Prop.P</th><th class='r'>Comida</th><th class='r'>TOTAL NETO</th></tr>";
    rows.forEach(function(r){
      body += "<tr class='" + (r.adminFijo?"admin":"") + "'>" +
        "<td><b>" + r.nombre + "</b></td><td>" + r.area + "</td>" +
        "<td class='r'>" + (r.dias||"&mdash;") + "</td>" +
        "<td class='r'>" + (r.sueldo>0?mxnD(r.sueldo):"&mdash;") + "</td>" +
        "<td class='r neg'>" + (r.moche>0?"("+mxnD(r.moche)+")":"-") + "</td>" +
        "<td class='r'>" + (r.propTarjeta>0?mxnD(r.propTarjeta):"-") + "</td>" +
        "<td class='r'>" + (r.propPiso>0?mxnD(r.propPiso):"-") + "</td>" +
        "<td class='r neg'>" + (r.comida>0?"("+mxnD(r.comida)+")":"-") + "</td>" +
        "<td class='r total pos'>" + (r.totalNeto>0?mxnD(r.totalNeto):"&mdash;") + "</td></tr>";
    });
    body += "<tr style='border-top:2px solid #166534;font-weight:700'>" +
      "<td colspan='3'><b>TOTAL</b></td>" +
      "<td class='r'>" + mxnD(ts) + "</td>" +
      "<td class='r neg'>(" + mxnD(tm) + ")</td>" +
      "<td class='r'>" + mxnD(tt) + "</td>" +
      "<td class='r'>" + mxnD(tp) + "</td>" +
      "<td class='r neg'>" + (tcm>0?"("+mxnD(tcm)+")":"-") + "</td>" +
      "<td class='r total'>" + mxnD(tNet) + "</td></tr></table>";
  }

  if (incluyeTodo || seccion==="asistencias") {
    var asist = data.asistencias||[];
    body += "<h2>Asistencias</h2><table>" +
      "<tr><th>Empleado</th><th>Area</th><th class='r'>Hrs Prog</th><th class='r'>Hrs Reales</th><th class='r'>Dias</th><th class='r'>Cumplimiento</th></tr>";
    rows.forEach(function(emp){
      var a = asist.find(function(x){return x.nombre&&x.nombre.toLowerCase()===emp.nombre.toLowerCase();});
      var hb = a?(a.horas_reales||0):0;
      var p = emp.hrsProg>0?(hb/emp.hrsProg*100):0;
      var color = emp.adminFijo?"#6b7280":p>=90?"#16a34a":hb>0?"#d97706":"#dc2626";
      body += "<tr class='" + (emp.adminFijo?"admin":"") + "'>" +
        "<td><b>" + emp.nombre + "</b></td><td>" + emp.area + "</td>" +
        "<td class='r'>" + (emp.adminFijo?"&mdash;":emp.hrsProg+"h") + "</td>" +
        "<td class='r'>" + (emp.adminFijo?"Fijo":a?hb+"h":"No asistio") + "</td>" +
        "<td class='r'>" + (emp.adminFijo?"5":a?(a.dias_asistidos||0):"&mdash;") + "</td>" +
        "<td class='r' style='color:" + color + "'>" + (emp.adminFijo?"N/A":p.toFixed(0)+"%") + "</td></tr>";
    });
    body += "</table>";
  }

  if (incluyeTodo || seccion==="sobres") {
    body += "<h2>Sobre de Pago &mdash; Sueldo + Propina Tarjeta</h2><table>" +
      "<tr><th>Empleado</th><th>Puesto</th><th class='r'>Sueldo</th><th class='r'>Propina Tarjeta</th><th class='r'>Total a Entregar</th></tr>";
    var tSuel=0,tPropT=0,tTot=0;
    rows.forEach(function(r){
      if(!r.enDocumento)return;
      var tot=r.sueldo+(r.propTarjeta||0);
      tSuel+=r.sueldo; tPropT+=(r.propTarjeta||0); tTot+=tot;
      body+="<tr class='"+(r.adminFijo?"admin":"")+"'>"+
        "<td><b>"+r.nombre+"</b></td><td>"+r.area+"</td>"+
        "<td class='r'>"+(r.sueldo>0?mxnD(r.sueldo):"&mdash;")+"</td>"+
        "<td class='r pos'>"+(r.propTarjeta>0?mxnD(r.propTarjeta):"-")+"</td>"+
        "<td class='r total'>"+(tot>0?mxnD(tot):"&mdash;")+"</td></tr>";
    });
    body+="<tr style='border-top:2px solid #166534;font-weight:700'>"+
      "<td colspan='2'><b>TOTAL</b></td>"+
      "<td class='r'>"+mxnD(tSuel)+"</td>"+
      "<td class='r pos'>"+mxnD(tPropT)+"</td>"+
      "<td class='r total'>"+mxnD(tTot)+"</td></tr></table>"+
      "<p style='font-size:9px;color:#6b7280;margin-top:4px'>* Propina tarjeta ya descontada la comisi&oacute;n del terminal (8%)</p>";
  }

  if (incluyeTodo || seccion==="ventas") {
    body += "<h2>Ventas por Grupo</h2><table>" +
      "<tr><th>Grupo</th><th class='r'>Venta</th><th class='r'>Cantidad</th><th class='r'>% Total</th></tr>";
    sorted.slice(0,20).forEach(function(g){
      var p2 = totalG>0?((g.venta||0)/totalG*100):0;
      body += "<tr><td>" + g.grupo + "</td><td class='r'><b>" + mxnD(g.venta) + "</b></td>" +
        "<td class='r'>" + (g.cantidad||0).toLocaleString("es-MX") + "</td>" +
        "<td class='r'>" + p2.toFixed(1) + "%</td></tr>";
    });
    body += "<tr style='font-weight:700;border-top:2px solid #166534'>" +
      "<td><b>TOTAL</b></td><td class='r total'>" + mxnD(totalG) + "</td>" +
      "<td class='r'>" + sorted.reduce(function(a,g){return a+(g.cantidad||0);},0).toLocaleString("es-MX") + "</td>" +
      "<td class='r'>100%</td></tr></table>";

    body += "<h2>Ventas por Mesero</h2><table>" +
      "<tr><th>Mesero</th><th class='r'>Venta</th><th class='r'>Propina Tarjeta</th></tr>";
    (data.ventas||[]).forEach(function(m){
      body += "<tr><td>" + m.nombre + "</td><td class='r'><b>" + mxnD(m.venta||0) + "</b></td>" +
        "<td class='r'>" + mxnD(m.prop_tarjeta||0) + "</td></tr>";
    });
    body += "</table>";
  }

  // ── Reporte por empleado ────────────────────────────────────────────────────
  if (seccion==="empleado" && empFiltro) {
    var emp = rows.find(function(r){ return r.nombre.toLowerCase()===empFiltro.toLowerCase(); });
    if (emp) {
      body += "<h2>Detalle de Empleado — " + emp.nombre + "</h2>";
      body += "<div class='kpi'><div class='kpi-label'>Puesto</div><div class='kpi-val' style='font-size:14px'>" + emp.area + "</div></div>" +
        "<div class='kpi'><div class='kpi-label'>Sueldo neto</div><div class='kpi-val'>" + mxnD(emp.totalNeto) + "</div></div>" +
        "<div class='kpi'><div class='kpi-label'>Propina tarjeta</div><div class='kpi-val'>" + mxnD(emp.propTarjeta) + "</div></div>" +
        "<div class='kpi'><div class='kpi-label'>Días asistidos</div><div class='kpi-val'>" + emp.dias + "</div></div>";
      body += "<h2 style='margin-top:20px'>Desglose</h2><table>" +
        "<tr><th>Concepto</th><th class='r'>Monto</th></tr>" +
        "<tr><td>Sueldo base</td><td class='r'><b>" + mxnD(emp.sueldo) + "</b></td></tr>" +
        (emp.moche>0?"<tr><td>(−) Moche (4.5%)</td><td class='r neg'>(" + mxnD(emp.moche) + ")</td></tr>":"") +
        (emp.propTarjeta>0?"<tr><td>(+) Propina tarjeta</td><td class='r pos'>" + mxnD(emp.propTarjeta) + "</td></tr>":"") +
        (emp.propPiso>0?"<tr><td>(+) Propina piso</td><td class='r pos'>" + mxnD(emp.propPiso) + "</td></tr>":"") +
        (emp.comida>0?"<tr><td>(−) Comida</td><td class='r neg'>(" + mxnD(emp.comida) + ")</td></tr>":"") +
        "<tr style='border-top:2px solid #166534;font-weight:700'><td><b>TOTAL A PAGAR</b></td><td class='r total pos'>" + mxnD(emp.totalNeto) + "</td></tr>" +
        "</table>";
      body += "<h2>Asistencia</h2><table>" +
        "<tr><th>Horas programadas</th><th>Horas reales</th><th>Días asistidos</th><th>Cumplimiento</th></tr>" +
        "<tr><td>" + (emp.adminFijo?"Fijo":emp.hrsProg+"h") + "</td>" +
        "<td>" + (emp.adminFijo?"Fijo":emp.horasReales+"h") + "</td>" +
        "<td>" + emp.dias + "</td>" +
        "<td>" + (emp.adminFijo?"N/A":emp.hrsProg>0?(emp.horasReales/emp.hrsProg*100).toFixed(0)+"%":"—") + "</td></tr>" +
        "</table>";
    } else {
      body += "<p>No se encontraron datos para el empleado seleccionado.</p>";
    }
  }

  return "<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><title>Reporte " + semana.key + "</title><style>" + css + "</style></head><body>" + body + "</body></html>";
}

function ModalReporte({data,semana,nomina,grupos,onClose,mobile}){
  const [seccion,setSeccion]=useState("todo");
  const [empFiltro,setEmpFiltro]=useState("");
  const opciones=[
    {id:"todo",       label:"Reporte completo",          icon:"📄"},
    {id:"resumen",    label:"Solo resumen ejecutivo",    icon:"📊"},
    {id:"nomina",     label:"Solo nómina",               icon:"◉"},
    {id:"asistencias",label:"Solo asistencias",          icon:"📅"},
    {id:"sobres",     label:"Sueldo + Propina tarjeta",  icon:"💵"},
    {id:"empleado",   label:"Detalle por empleado",      icon:"👤"},
    {id:"ventas",     label:"Solo ventas",               icon:"◆"},
  ];
  const abrir=()=>{
    const html=generarReporteHTML(data,semana,nomina?.rows,grupos,seccion,empFiltro);
    const win=window.open("","_blank");
    if(win){win.document.write(html);win.document.close();setTimeout(()=>win.print(),600);}
  };
  return(
    <div style={{position:"fixed",inset:0,background:"#000b",display:"flex",alignItems:mobile?"flex-end":"center",justifyContent:"center",zIndex:2000}}
      onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:C.s2,border:"1px solid "+C.border,borderRadius:mobile?"12px 12px 0 0":"12px",padding:mobile?"20px 16px 28px":"28px",width:mobile?"100%":"auto",minWidth:mobile?"auto":360,maxWidth:mobile?"100%":440,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:C.ink}}>Generar Reporte</div>
            <div style={{fontSize:9,color:C.ink4,marginTop:2}}>Semana {semana.key}</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",color:C.ink4,fontSize:18,cursor:"pointer"}}>✕</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:16}}>
          {opciones.map(o=>(
            <button key={o.id} onClick={()=>setSeccion(o.id)} style={{padding:"10px 14px",borderRadius:7,border:"1px solid "+(seccion===o.id?C.green:C.border),background:seccion===o.id?C.green+"15":C.s3,color:seccion===o.id?C.green:C.ink3,fontSize:11,cursor:"pointer",textAlign:"left",fontWeight:seccion===o.id?700:400}}>
              <span style={{marginRight:8}}>{o.icon}</span>{o.label}
            </button>
          ))}
        </div>
        {/* Selector de empleado — solo para sección "empleado" */}
        {seccion==="empleado"&&(
          <div style={{marginBottom:16}}>
            <div style={{fontSize:10,color:C.ink4,marginBottom:6,fontWeight:600}}>Selecciona el empleado:</div>
            <select value={empFiltro} onChange={e=>setEmpFiltro(e.target.value)}
              style={{width:"100%",padding:"9px 12px",background:C.s3,border:"1px solid "+(empFiltro?C.green:C.border),borderRadius:7,color:empFiltro?C.ink:C.ink4,fontSize:12}}>
              <option value="">— Elige un empleado —</option>
              {(nomina?.rows||[]).map(e=>(
                <option key={e.nombre} value={e.nombre}>{e.nombre} · {e.area}</option>
              ))}
            </select>
          </div>
        )}
        <div style={{display:"flex",gap:8}}>
          <button onClick={abrir} disabled={seccion==="empleado"&&!empFiltro}
            style={{flex:1,padding:"11px 16px",borderRadius:7,border:"none",background:seccion==="empleado"&&!empFiltro?C.s3:C.green,color:seccion==="empleado"&&!empFiltro?C.ink4:"#000",fontSize:12,cursor:seccion==="empleado"&&!empFiltro?"default":"pointer",fontWeight:700}}>
            🖨 Imprimir / Guardar PDF
          </button>
          <button onClick={onClose} style={{padding:"11px 14px",borderRadius:7,border:"1px solid "+C.border,background:"none",color:C.ink4,fontSize:12,cursor:"pointer"}}>
            Cancelar
          </button>
        </div>
        <div style={{marginTop:10,fontSize:8,color:C.ink4,textAlign:"center"}}>
          Ctrl+P en la nueva pestaña para guardar como PDF
        </div>
      </div>
    </div>
  );
}

// ── TAB EMPLEADOS (CRUD) ──────────────────────────────────────────────────────
// Catálogo editable — reemplaza el EMPLEADOS_BASE hardcodeado. Baja lógica:
// nunca se borra físicamente, para no perder el historial de semanas pasadas.
// EmpleadoField/empleadoInputStyle viven fuera de TabEmpleados a propósito:
// si se redefinen dentro del componente, React los trata como un tipo nuevo
// en cada render y remonta el <input> en cada tecla (pierde el foco).
const EmpleadoField=({label,children})=>(<div style={{display:"flex",flexDirection:"column",gap:4}}><span style={{fontSize:8,color:C.ink4,textTransform:"uppercase",letterSpacing:"0.05em"}}>{label}</span>{children}</div>);
const empleadoInputStyle={padding:"7px 9px",background:C.s3,border:"1px solid "+C.border,borderRadius:6,color:C.ink,fontSize:12,fontFamily:"monospace"};

function TabEmpleados({reload}){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [editing,setEditing]=useState(null); // id del empleado, o "new"
  const [form,setForm]=useState({});
  const [saving,setSaving]=useState(false);

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const r=await fetch(API+"/api/empleados?incluirInactivos=1");
      const d=await r.json();
      if(d.ok)setRows(d.empleados||[]);
    }catch(e){console.error("empleados error",e);}
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const startNew=()=>{setForm({nombre:"",area:"",dept:"bar",salDiario:0,hrsProg:0,pagoFijo:"",adminFijo:false,enPiso:false,orden:rows.length});setEditing("new");};
  const startEdit=(e)=>{setForm({nombre:e.nombre,area:e.area||"",dept:e.dept||"bar",salDiario:e.sal_diario||0,hrsProg:e.hrs_prog||0,pagoFijo:e.pago_fijo??"",adminFijo:!!e.admin_fijo,enPiso:!!e.en_piso,orden:e.orden||0});setEditing(e.id);};

  const save=async()=>{
    setSaving(true);
    try{
      const body={
        nombre:(form.nombre||"").trim(), area:form.area, dept:form.dept,
        salDiario:+form.salDiario||0, hrsProg:+form.hrsProg||0,
        pagoFijo:form.pagoFijo===""?null:+form.pagoFijo,
        adminFijo:!!form.adminFijo, enPiso:!!form.enPiso,
        orden:+form.orden||0,
      };
      const url=editing==="new"?API+"/api/empleados":API+"/api/empleados/"+editing;
      const method=editing==="new"?"POST":"PUT";
      const r=await fetch(url,{method,headers:{"Content-Type":"application/json","x-app-secret":"BarHub2026"},body:JSON.stringify(body)});
      const d=await r.json();
      if(!d.ok)throw new Error(d.error||"Error al guardar");
      setEditing(null);
      await load();
      if(reload)await reload();
    }catch(e){alert("Error: "+e.message);}
    setSaving(false);
  };

  const toggleActivo=async(e)=>{
    if(e.activo){
      if(!confirm("¿Dar de baja a "+e.nombre+"? No se borra su historial, solo deja de aparecer en semanas nuevas."))return;
      await fetch(API+"/api/empleados/"+e.id,{method:"DELETE",headers:{"x-app-secret":"BarHub2026"}});
    }else{
      await fetch(API+"/api/empleados/"+e.id,{method:"PUT",headers:{"Content-Type":"application/json","x-app-secret":"BarHub2026"},body:JSON.stringify({activo:true})});
    }
    await load();
    if(reload)await reload();
  };

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:13,fontWeight:700,color:C.ink}}>Catálogo de empleados</div>
        <button onClick={startNew} style={{padding:"6px 14px",borderRadius:6,border:"1px solid "+C.greenDim,background:C.green+"18",color:C.green,fontSize:11,fontWeight:700,cursor:"pointer"}}>+ Nuevo empleado</button>
      </div>

      {editing&&(
        <Card title={editing==="new"?"Nuevo empleado":"Editar empleado"}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:12}}>
            <EmpleadoField label="Nombre"><input style={empleadoInputStyle} value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))}/></EmpleadoField>
            <EmpleadoField label="Área"><input style={empleadoInputStyle} value={form.area} onChange={e=>setForm(f=>({...f,area:e.target.value}))} placeholder="Caja, Mesero, Cocina…"/></EmpleadoField>
            <EmpleadoField label="Depto">
              <select style={empleadoInputStyle} value={form.dept} onChange={e=>setForm(f=>({...f,dept:e.target.value}))}>
                <option value="bar">bar</option><option value="cocina">cocina</option><option value="admin">admin</option>
              </select>
            </EmpleadoField>
            <EmpleadoField label="Salario diario"><input type="number" style={empleadoInputStyle} value={form.salDiario} onChange={e=>setForm(f=>({...f,salDiario:e.target.value}))}/></EmpleadoField>
            <EmpleadoField label="Horas prog./sem"><input type="number" style={empleadoInputStyle} value={form.hrsProg} onChange={e=>setForm(f=>({...f,hrsProg:e.target.value}))}/></EmpleadoField>
            <EmpleadoField label="Pago fijo sem. (vacío=por día)"><input type="number" style={empleadoInputStyle} value={form.pagoFijo} onChange={e=>setForm(f=>({...f,pagoFijo:e.target.value}))}/></EmpleadoField>
            <EmpleadoField label="Orden"><input type="number" style={empleadoInputStyle} value={form.orden} onChange={e=>setForm(f=>({...f,orden:e.target.value}))}/></EmpleadoField>
          </div>
          <div style={{display:"flex",gap:16,marginBottom:14,flexWrap:"wrap"}}>
            <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:C.ink3,cursor:"pointer"}}>
              <input type="checkbox" checked={form.adminFijo} onChange={e=>setForm(f=>({...f,adminFijo:e.target.checked}))}/> Admin fijo (siempre cobra completo)
            </label>
            <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:C.ink3,cursor:"pointer"}}>
              <input type="checkbox" checked={form.enPiso} onChange={e=>setForm(f=>({...f,enPiso:e.target.checked}))}/> En piso (recibe reparto de moche)
            </label>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={save} disabled={saving||!(form.nombre||"").trim()} style={{padding:"8px 16px",borderRadius:6,border:"1px solid "+C.greenDim,background:C.green+"18",color:C.green,fontSize:11,fontWeight:700,cursor:"pointer",opacity:saving?0.6:1}}>{saving?"Guardando...":"💾 Guardar"}</button>
            <button onClick={()=>setEditing(null)} style={{padding:"8px 16px",borderRadius:6,border:"1px solid "+C.border,background:"none",color:C.ink3,fontSize:11,cursor:"pointer"}}>Cancelar</button>
          </div>
        </Card>
      )}

      <Card title={"Empleados · "+rows.filter(e=>e.activo).length+" activos"}>
        {loading?<div style={{padding:24,textAlign:"center",color:C.ink4}}>Cargando…</div>:(
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <TH cols={["Empleado","Área","Depto","Sal. diario","Hrs prog","Pago fijo","Piso","Estado",""]}/>
            <tbody>
              {rows.map((e,i)=>{const col=AREA_COLOR[e.area]||C.ink4;return(
                <tr key={e.id} style={{borderBottom:"1px solid "+C.border,background:!e.activo?C.s3+"40":i%2===0?"transparent":C.s3+"60",opacity:e.activo?1:0.55}}>
                  <td style={{padding:"9px 10px"}}><div style={{display:"flex",alignItems:"center",gap:8}}><Av n={e.nombre} c={col}/><span style={{fontSize:11,fontWeight:600}}>{e.nombre}</span></div></td>
                  <td style={{padding:"9px 10px"}}><Badge label={e.area||"—"} color={col} bg={col+"15"}/></td>
                  <td style={{padding:"9px 10px",fontSize:10,color:C.ink3}}>{e.dept||"—"}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.ink2}}>{mxn(e.sal_diario||0)}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.ink3}}>{e.hrs_prog||0}h</td>
                  <td style={{padding:"9px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.ink3}}>{e.pago_fijo!=null?mxn(e.pago_fijo):"—"}</td>
                  <td style={{padding:"9px 10px",textAlign:"center"}}>{e.en_piso?<Badge label="Sí" color={C.blue} bg={C.blue+"15"}/>:<span style={{color:C.ink4,fontSize:10}}>—</span>}</td>
                  <td style={{padding:"9px 10px",textAlign:"center"}}>{e.activo?<Badge label="Activo" color={C.green} bg={C.green+"15"}/>:<Badge label="Baja" color={C.red} bg={C.red+"15"}/>}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",whiteSpace:"nowrap"}}>
                    <button onClick={()=>startEdit(e)} style={{padding:"4px 8px",borderRadius:5,border:"1px solid "+C.border,background:C.s3,color:C.ink3,fontSize:9,cursor:"pointer",marginRight:4}}>✎</button>
                    <button onClick={()=>toggleActivo(e)} style={{padding:"4px 8px",borderRadius:5,border:"1px solid "+(e.activo?C.red:C.green),background:"none",color:e.activo?C.red:C.green,fontSize:9,cursor:"pointer"}}>{e.activo?"Baja":"Reactivar"}</button>
                  </td>
                </tr>
              );})}
              {!rows.length&&<tr><td colSpan={9} style={{padding:24,textAlign:"center",color:C.ink4,fontSize:10}}>Sin empleados.</td></tr>}
            </tbody>
          </table>
        )}
      </Card>
    </div>
  );
}

// ── TAB COMPRAS ───────────────────────────────────────────────────────────────
function TabCompras({data,semana,loadData}){
  const compras=data.compras||[];
  const [area,setArea]=useState("bar");
  const [proveedor,setProveedor]=useState("");
  const [descripcion,setDescripcion]=useState("");
  const [monto,setMonto]=useState("");
  const [fecha,setFecha]=useState(fmt(new Date()));
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState("");
  const [estadoPago,setEstadoPago]=useState("pagado");
  const [plazoDias,setPlazoDias]=useState(30);
  const [fotoPreview,setFotoPreview]=useState(null);
  const [extracting,setExtracting]=useState(false);

  const sugs=area==="bar"?PROVEEDORES_BAR:area==="cocina"?PROVEEDORES_COCINA:PROVEEDORES_COMP;

  const totalBar=compras.filter(c=>c.area==="bar").reduce((a,c)=>a+(c.monto||0),0);
  const totalCocina=compras.filter(c=>c.area==="cocina").reduce((a,c)=>a+(c.monto||0),0);
  const totalComp=compras.filter(c=>c.area==="compartido").reduce((a,c)=>a+(c.monto||0),0);
  const totalGen=totalBar+totalCocina+totalComp;

  const handleAdd=async()=>{
    if(!proveedor.trim()||!monto){setError("Proveedor y monto son requeridos");return;}
    setSaving(true);setError("");
    try{
      const r=await fetch(API+"/api/compras",{method:"POST",headers:{"Content-Type":"application/json","x-app-secret":"BarHub2026"},
        body:JSON.stringify({semana:semana.key,fecha,proveedor:proveedor.trim(),descripcion,monto:+monto,area,estado_pago:estadoPago,plazo_dias:estadoPago==="credito"?plazoDias:null})});
      const d=await r.json();
      if(!d.ok)throw new Error(d.error);
      setProveedor("");setDescripcion("");setMonto("");setFecha(fmt(new Date()));setEstadoPago("pagado");setPlazoDias(30);setFotoPreview(null);
      if(loadData)await loadData(semana.key);
    }catch(e){setError(e.message);}
    setSaving(false);
  };

  const handleDel=async(id)=>{
    if(!confirm("¿Eliminar este gasto?"))return;
    await fetch(API+"/api/compras/"+id,{method:"DELETE",headers:{"x-app-secret":"BarHub2026"}});
    if(loadData)await loadData(semana.key);
  };

  const handleFoto=async(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    e.target.value="";
    setExtracting(true);setError("");
    try{
      // Comprimir con canvas: max 1200px, JPEG 0.85 — reduce de 5MB a ~150KB
      const compressedDataUrl=await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onerror=reject;
        reader.onload=(ev)=>{
          const img=new Image();
          img.onerror=reject;
          img.onload=()=>{
            const MAX=1200;
            let w=img.width,h=img.height;
            if(w>MAX||h>MAX){
              if(w>h){h=Math.round(h*MAX/w);w=MAX;}
              else{w=Math.round(w*MAX/h);h=MAX;}
            }
            const canvas=document.createElement("canvas");
            canvas.width=w;canvas.height=h;
            canvas.getContext("2d").drawImage(img,0,0,w,h);
            resolve(canvas.toDataURL("image/jpeg",0.85));
          };
          img.src=ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      setFotoPreview(compressedDataUrl);
      const base64=compressedDataUrl.split(",")[1];
      const r=await fetch(API+"/api/compras/foto",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-app-secret":"BarHub2026"},
        body:JSON.stringify({imagen:base64,mediaType:"image/jpeg"})
      });
      if(!r.ok){
        let msg=`Error ${r.status}`;
        try{const t=await r.text();msg=JSON.parse(t).error||msg;}catch{}
        throw new Error(msg);
      }
      const d=await r.json();
      if(d.ok&&d.data){
        if(d.data.proveedor)setProveedor(d.data.proveedor);
        if(d.data.monto!=null)setMonto(String(d.data.monto));
        if(d.data.fecha)setFecha(d.data.fecha);
        if(d.data.descripcion)setDescripcion(d.data.descripcion);
        if(d.data.area&&["bar","cocina","compartido"].includes(d.data.area))setArea(d.data.area);
      }else setError(d.error||"No se pudieron extraer datos de la imagen");
    }catch(err){setError("Error al procesar imagen: "+err.message);}
    setExtracting(false);
  };

  const areaColor={bar:C.blue,cocina:C.amber,compartido:C.teal};
  const areaLabel={bar:"Bar",cocina:"Cocina",compartido:"Compartido"};

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
        <KPI label="Total semana"   value={mxn(totalGen)}     color={C.ink}/>
        <KPI label="Bar"            value={mxn(totalBar)}     color={C.blue}/>
        <KPI label="Cocina"         value={mxn(totalCocina)}  color={C.amber}/>
        <KPI label="Compartido"     value={mxn(totalComp)}    color={C.teal}/>
      </div>

      {/* Formulario */}
      <div style={{background:C.s2,border:"1px solid "+C.border,borderRadius:12,padding:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:C.ink3,textTransform:"uppercase",letterSpacing:1}}>Registrar Compra / Gasto Variable</div>
          <label style={{display:"flex",alignItems:"center",gap:6,padding:"5px 14px",borderRadius:6,border:"1px solid "+(extracting?C.blue:C.border),background:extracting?C.blue+"15":C.s3,color:extracting?C.blue:C.ink3,fontSize:10,cursor:extracting?"default":"pointer",fontWeight:600,transition:"all .2s",whiteSpace:"nowrap"}}>
            <input type="file" accept="image/*" capture="environment" onChange={handleFoto} disabled={extracting} style={{display:"none"}}/>
            {extracting?"⏳ Extrayendo...":"📷 Foto ticket"}
          </label>
        </div>
        {fotoPreview&&<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,padding:"8px 12px",background:C.s3,borderRadius:8,border:"1px solid "+C.greenDim}}>
          <img src={fotoPreview} alt="ticket" style={{height:64,width:64,objectFit:"cover",borderRadius:6,flexShrink:0,border:"1px solid "+C.border}}/>
          <div style={{flex:1}}>
            <div style={{fontSize:9,color:C.green,fontWeight:700,marginBottom:2}}>✓ Imagen cargada · datos pre-llenados</div>
            <div style={{fontSize:8,color:C.ink4}}>Verifica y corrige los campos antes de guardar</div>
          </div>
          <button onClick={()=>setFotoPreview(null)} style={{background:"none",border:"none",color:C.ink4,fontSize:16,cursor:"pointer",padding:"0 4px"}}>✕</button>
        </div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr auto",gap:8,alignItems:"end"}}>
          <div>
            <div style={{fontSize:9,color:C.ink3,marginBottom:4}}>ÁREA</div>
            <select value={area} onChange={e=>{setArea(e.target.value);setProveedor("");}}
              style={{width:"100%",background:C.s3,border:"1px solid "+C.border,borderRadius:6,padding:"6px 8px",color:C.ink,fontSize:12}}>
              <option value="bar">Bar</option>
              <option value="cocina">Cocina</option>
              <option value="compartido">Compartido</option>
            </select>
          </div>
          <div>
            <div style={{fontSize:9,color:C.ink3,marginBottom:4}}>PROVEEDOR</div>
            <input list="provs-list" value={proveedor} onChange={e=>setProveedor(e.target.value)} placeholder="Ej: Cerveza Nacional"
              style={{width:"100%",background:C.s3,border:"1px solid "+C.border,borderRadius:6,padding:"6px 8px",color:C.ink,fontSize:12}}/>
            <datalist id="provs-list">{sugs.map((s,i)=><option key={i} value={s}/>)}</datalist>
          </div>
          <div>
            <div style={{fontSize:9,color:C.ink3,marginBottom:4}}>DESCRIPCIÓN (opcional)</div>
            <input value={descripcion} onChange={e=>setDescripcion(e.target.value)} placeholder="Notas..."
              style={{width:"100%",background:C.s3,border:"1px solid "+C.border,borderRadius:6,padding:"6px 8px",color:C.ink,fontSize:12}}/>
          </div>
          <div>
            <div style={{fontSize:9,color:C.ink3,marginBottom:4}}>MONTO</div>
            <input type="number" value={monto} onChange={e=>setMonto(e.target.value)} placeholder="0.00" min="0"
              style={{width:"100%",background:C.s3,border:"1px solid "+C.border,borderRadius:6,padding:"6px 8px",color:C.ink,fontSize:12}}/>
          </div>
          <button onClick={handleAdd} disabled={saving}
            style={{background:C.green,color:"#000",border:"none",borderRadius:6,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
            {saving?"...":"＋ Agregar"}
          </button>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",marginTop:10}}>
          <span style={{fontSize:9,color:C.ink3,textTransform:"uppercase",letterSpacing:0.5}}>Pago:</span>
          {["pagado","credito"].map(op=>(
            <button key={op} onClick={()=>setEstadoPago(op)}
              style={{padding:"4px 14px",borderRadius:5,border:"1px solid "+(estadoPago===op?(op==="pagado"?C.green:C.amber):C.border),background:estadoPago===op?(op==="pagado"?C.green+"20":C.amber+"20"):"none",color:estadoPago===op?(op==="pagado"?C.green:C.amber):C.ink4,fontSize:10,cursor:"pointer",fontWeight:estadoPago===op?700:400,transition:"all .15s"}}>
              {op==="pagado"?"✓ Pagado":"Crédito"}
            </button>
          ))}
          {estadoPago==="credito"&&(
            <div style={{display:"flex",alignItems:"center",gap:4}}>
              <input type="number" min="1" max="365" value={plazoDias} onChange={e=>setPlazoDias(+e.target.value||30)}
                style={{width:52,padding:"4px 6px",background:C.s3,border:"1px solid "+C.amber,borderRadius:5,color:C.amber,fontSize:11,fontFamily:"monospace",textAlign:"right"}}/>
              <span style={{fontSize:9,color:C.ink4}}>días</span>
            </div>
          )}
        </div>
        {error&&<div style={{color:C.red,fontSize:10,marginTop:8}}>{error}</div>}
      </div>

      {/* Tabla */}
      <div style={{background:C.s2,border:"1px solid "+C.border,borderRadius:12,overflow:"hidden"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr style={{background:C.s3}}>
              {["Fecha","Proveedor","Descripción","Área","Monto","Pago",""].map((h,i)=>(
                <th key={i} style={{padding:"8px 12px",textAlign:i===4?"right":"left",fontSize:9,color:C.ink3,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {compras.length===0&&(
              <tr><td colSpan={6} style={{padding:"24px",textAlign:"center",color:C.ink4,fontSize:11}}>Sin compras registradas esta semana</td></tr>
            )}
            {[...compras].sort((a,b)=>(a.fecha||"")>(b.fecha||"")?1:-1).map(c=>(
              <tr key={c.id} style={{borderTop:"1px solid "+C.border}}>

          </tbody>
          {compras.length>0&&(
            <tfoot>
              <tr style={{borderTop:"2px solid "+C.border,background:C.s3}}>
                <td colSpan={3} style={{padding:"8px 12px",fontSize:10,color:C.ink3}}>
                  {["bar","cocina","compartido"].map(a=>{
                    const t=compras.filter(c=>c.area===a).reduce((s,c)=>s+(c.monto||0),0);

                  })}
                </td>
                <td style={{padding:"8px 12px",color:C.ink3,fontSize:10}}>Total</td>
                <td style={{padding:"8px 12px",textAlign:"right",fontFamily:"monospace",fontWeight:700,color:C.green,fontSize:13}}>{mxn(totalGen)}</td>
                <td/>
                <td/>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
    </div>
  );
}

// ── BALANCE HELPERS ───────────────────────────────────────────────────────────
// Métricas de una semana para la vista mensual — usa la nómina ya calculada
// por el servidor (s.nomina, de /api/dashboard/balance-mensual) en vez de
// recalcularla en el cliente.
function calcBalanceSemana(s){
  const nom=s.nomina||[];
  const topG=(s.ventasGrupo||[]).filter(g=>!g.es_subgrupo);
  const hasG=topG.length>0;
  const vBar=hasG?topG.filter(g=>g.grupo!=="Alimentos").reduce((a,g)=>a+(g.venta||0),0):0;
  const vCoc=hasG?topG.filter(g=>g.grupo==="Alimentos").reduce((a,g)=>a+(g.venta||0),0):0;
  const vFb =!hasG?(s.ventasMesero||[]).reduce((a,m)=>a+(m.venta||0),0):0;
  const vTot=hasG?vBar+vCoc:vFb;
  const nomBar  =nom.filter(e=>e.dept==="bar")  .reduce((a,e)=>a+e.total,0);
  const nomCoc  =nom.filter(e=>e.dept==="cocina").reduce((a,e)=>a+e.total,0);
  const nomAdmin=nom.filter(e=>e.dept==="admin") .reduce((a,e)=>a+e.total,0);
  const nomTot  =nomBar+nomCoc+nomAdmin;
  const cp=s.compras||[];
  const cpB=cp.filter(c=>c.area==="bar").reduce((a,c)=>a+(c.monto||0),0);
  const cpC=cp.filter(c=>c.area==="cocina").reduce((a,c)=>a+(c.monto||0),0);
  const cpX=cp.filter(c=>c.area==="compartido").reduce((a,c)=>a+(c.monto||0),0);
  const bPct=vTot>0&&hasG?vBar/vTot:0.7;
  const cpBT=cpB+cpX*bPct;
  const cpCT=cpC+cpX*(1-bPct);
  return{hasG,vBar,vCoc,vFb,vTot,nomBar,nomCoc,nomAdmin,nomTot,cpBT,cpCT,cpTot:cpBT+cpCT,bPct};
}

// Renderiza la vista mensual (con detalle por semana)
function BalanceMensualView({mesData,mesLoading,gfEdit,setGfEdit,gfSaving,saveGF,delGF,gastosMes}){
  if(mesLoading) return <div style={{padding:40,textAlign:"center",color:C.ink4}}>Cargando datos del mes…</div>;
  if(!mesData)   return <div style={{padding:40,textAlign:"center",color:C.ink4}}>Sin datos mensuales.</div>;

  const gfData=mesData.gastosFijos||[];
  const semanas=mesData.semanas||[];

  // Calcular métricas por semana
  const semCalc=semanas.map(s=>({...s,...calcBalanceSemana(s)}));

  // Totales mensuales
  const mVBar =semCalc.reduce((a,s)=>a+s.vBar,0);
  const mVCoc =semCalc.reduce((a,s)=>a+s.vCoc,0);
  const mVFb  =semCalc.reduce((a,s)=>a+s.vFb,0);
  const hasAnyG=semCalc.some(s=>s.hasG);
  const mVTot =hasAnyG?mVBar+mVCoc:mVFb;
  const mNomBar  =semCalc.reduce((a,s)=>a+s.nomBar,0);
  const mNomCoc  =semCalc.reduce((a,s)=>a+s.nomCoc,0);
  const mNomAdmin=semCalc.reduce((a,s)=>a+s.nomAdmin,0);
  const mNomTot  =mNomBar+mNomCoc+mNomAdmin;
  const mCpBT=semCalc.reduce((a,s)=>a+s.cpBT,0);
  const mCpCT=semCalc.reduce((a,s)=>a+s.cpCT,0);
  const mCpTot=mCpBT+mCpCT;

  // Gastos fijos: monto TOTAL mensual (sin prorratear)

  const gfCocM =(gfData.filter(g=>g.area==="cocina").reduce((a,g)=>a+(g.monto||0),0) + gfData.filter(g=>g.area==="compartido").reduce((a,g)=>a+(g.monto||0),0)*(1-mBarPct));
  const gfTotM =gfBarM+gfCocM;

  const uBar=mVBar-(mNomBar+mNomAdmin)-mCpBT-gfBarM;
  const uCoc=mVCoc-mNomCoc-mCpCT-gfCocM;
  const uTot=mVTot-mNomTot-mCpTot-gfTotM;
  const margen=mVTot>0?uTot/mVTot*100:0;

        <KPI label="Egresos totales"       value={"("+mxn(mNomTot+mCpTot+gfTotM)+")"} color={C.red}/>
        <KPI label="Utilidad mensual"      value={mxn(uTot)}                    color={uTot>=0?C.green:C.red}/>
        <KPI label="Margen"                value={pct(margen)}                   color={margen>=0?C.teal:C.red}/>
