<script type="text/babel">
const {useState,useEffect,useCallback}=React;
const API="";

// ── COLORES ──────────────────────────────────────────────────────────────────
// C y AREA_COLOR se mutan in-place (Object.assign) al cambiar de tema en vez de
// reasignarse, para que todos los componentes (que leen C.xxx en cada render)
// vean el tema nuevo sin tener que pasar `theme` por props en toda la app.
const THEMES={
  dark:{
    bg:"#0D0F0E",surface:"#141716",s2:"#1B1E1C",s3:"#222623",s4:"#282C29",
    border:"#2A2E2B",ink:"#E8EDE9",ink2:"#B4BDB5",ink3:"#7A8A7C",ink4:"#4A574C",
    green:"#4ADE80",greenDim:"#166534",red:"#F87171",amber:"#FCD34D",
    blue:"#60A5FA",teal:"#2DD4BF",purple:"#A78BFA",pink:"#F472B6",orange:"#FB923C",
  },
  light:{
    bg:"#F3F5F3",surface:"#FFFFFF",s2:"#F3F5F3",s3:"#E8ECE8",s4:"#DDE3DD",
    border:"#D6DCD6",ink:"#141815",ink2:"#3A453C",ink3:"#67756A",ink4:"#94A296",
    green:"#15803D",greenDim:"#86EFAC",red:"#DC2626",amber:"#B45309",
    blue:"#2563EB",teal:"#0D9488",purple:"#7C3AED",pink:"#DB2777",orange:"#EA580C",
  },
};
let C={...THEMES.dark};
let AREA_COLOR={};
function applyTheme(name){
  Object.assign(C, THEMES[name==="light"?"light":"dark"]);
  Object.assign(AREA_COLOR, {Caja:C.purple,Barra:C.teal,Cocina:C.amber,Mesero:C.blue,Admin:C.green,"Comodín":C.pink,"Comodin":C.pink});
}
applyTheme("dark");

const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

// ── HELPERS ──────────────────────────────────────────────────────────────────
const mxn =v=>"$"+Math.round(v).toLocaleString("es-MX");
const mxnD=v=>"$"+Number(v).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct =v=>Number(v).toFixed(1)+"%";
const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function getSemanaActual(){
  const hoy=new Date();
  const noon=new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate(),12,0,0);
  const dow=noon.getDay(),d=dow===0?0:dow;
  const dom=new Date(noon.getFullYear(),noon.getMonth(),noon.getDate()-d,12,0,0);
  const sab=new Date(dom.getFullYear(),dom.getMonth(),dom.getDate()+6,12,0,0);
  return {dom,sab,key:fmt(dom)+"_a_"+fmt(sab),label:dom.getDate()+" "+MESES[dom.getMonth()].slice(0,3)+" – "+sab.getDate()+" "+MESES[sab.getMonth()].slice(0,3)};
}
function getSemanaOffset(base,offset){
  const dom=new Date(base.dom.getFullYear(),base.dom.getMonth(),base.dom.getDate()+offset*7,12,0,0);
  const sab=new Date(dom.getFullYear(),dom.getMonth(),dom.getDate()+6,12,0,0);
  return {dom,sab,key:fmt(dom)+"_a_"+fmt(sab),label:dom.getDate()+" "+MESES[dom.getMonth()].slice(0,3)+" – "+sab.getDate()+" "+MESES[sab.getMonth()].slice(0,3)};
}
// Construye el objeto semana {dom,sab,key,label} a partir de cualquier domingo,
// para poder saltar directo a una semana del selector Año/Mes/Semana (no solo
// navegar por offset relativo a hoy).
function semanaDeFecha(domDate){
  const dom=new Date(domDate.getFullYear(),domDate.getMonth(),domDate.getDate(),12,0,0);
  const sab=new Date(dom.getFullYear(),dom.getMonth(),dom.getDate()+6,12,0,0);
  return {dom,sab,key:fmt(dom)+"_a_"+fmt(sab),label:dom.getDate()+" "+MESES[dom.getMonth()].slice(0,3)+" – "+sab.getDate()+" "+MESES[sab.getMonth()].slice(0,3)};
}

// ── EDICIÓN PERSISTENTE DE NÓMINA/PROPINAS ───────────────────────────────────
// Todo campo numérico de Nómina/Propinas se guarda de inmediato en el servidor
// (PUT /api/nomina o /api/propinas — ambas rutas comparten la misma tabla de
// overrides). Ya no existen los overrides de sesión que se perdían al refrescar.
async function putNomina(base,semanaKey,nombre,patch){
  const r=await fetch(API+"/api/"+base+"/"+encodeURIComponent(semanaKey)+"/"+encodeURIComponent(nombre),{
    method:"PUT",headers:{"Content-Type":"application/json","x-app-secret":"BarHub2026"},
    body:JSON.stringify(patch)
  });
  const d=await r.json();
  if(!d.ok)throw new Error(d.error||"Error al guardar");
  return d;
}

// Input numérico que guarda solo al perder foco y solo si el valor cambió.
// value=null/undefined se muestra vacío (placeholder); enviar "" de vuelta
// limpia el override (vuelve al cálculo por defecto del servidor).
function EditNum({value,placeholder,color,width,onSave}){
  const [local,setLocal]=useState(null);
  const [saving,setSaving]=useState(false);
  const shown=local!==null?local:(value??"");
  return <input type="number" value={shown} placeholder={placeholder ?? "auto"} disabled={saving}
    onChange={e=>setLocal(e.target.value)}
    onFocus={()=>{if(local===null)setLocal(value!=null?String(value):"");}}
    onBlur={()=>{
      if(local===null)return;
      const raw=local;setLocal(null);
      const v=raw===""?null:(parseFloat(raw)||0);
      if(v===(value??null))return;
      setSaving(true);
      onSave(v).catch(e=>alert("Error al guardar: "+e.message)).finally(()=>setSaving(false));
    }}
    style={{width:width||70,padding:"3px 6px",background:C.s3,border:"1px solid "+C.border,borderRadius:5,color:color||C.ink,fontSize:11,fontFamily:"monospace",textAlign:"right",opacity:saving?0.55:1}}/>;
}

// ── UI COMPONENTS ─────────────────────────────────────────────────────────────
function Av({n,c,size=26}){return <div style={{width:size,height:size,borderRadius:"50%",background:c+"22",border:"1px solid "+c+"44",display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.34,fontWeight:700,color:c,flexShrink:0}}>{(n||"?")[0].toUpperCase()}</div>;}
function Badge({label,color,bg}){return <span style={{padding:"2px 7px",borderRadius:4,background:bg||color+"22",color,fontSize:8,fontWeight:700}}>{label}</span>;}
function KPI({label,value,sub,color,trend,onClick,active}){
  return <div onClick={onClick} style={{background:C.s2,border:"1px solid "+(active?color:C.border),borderRadius:8,padding:"12px 14px",cursor:onClick?"pointer":"default",transition:"border-color .15s"}}>
    <div style={{fontSize:7,textTransform:"uppercase",letterSpacing:"0.1em",color:active?color:C.ink4,marginBottom:4}}>{label}</div>
    <div style={{fontSize:18,fontWeight:800,color:color||C.ink,fontFamily:"monospace"}}>{value}</div>
    {sub&&<div style={{fontSize:8,color:C.ink4,marginTop:2}}>{sub}</div>}
    {trend!=null&&<div style={{fontSize:8,color:trend>=0?C.green:C.red,marginTop:2}}>{trend>=0?"↑":"↓"} {Math.abs(trend).toFixed(1)}% vs sem ant</div>}
    {onClick&&<div style={{fontSize:7,color:active?color:C.ink4,marginTop:4}}>▾ {active?"cerrar":"ver desglose"}</div>}
  </div>;
}
function TH({cols}){return <thead><tr>{cols.map((c,i)=><th key={i} style={{padding:"8px 10px",textAlign:i>1?"right":"left",fontSize:7,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:C.ink4,borderBottom:"1px solid "+C.border,whiteSpace:"nowrap"}}>{c}</th>)}</tr></thead>;}
function Card({title,children,action}){return(
  <div style={{background:C.s2,border:"1px solid "+C.border,borderRadius:10,padding:"14px 16px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <span style={{fontSize:8,fontWeight:700,letterSpacing:"0.13em",textTransform:"uppercase",color:C.ink4}}>{title}</span>
      {action}
    </div>
    {children}
  </div>
);}
// Proveedores sugeridos por área (del Excel formato-gastos-ingresos)
const PROVEEDORES_BAR=["Cerveza Nacional","Cerveza Artesanal","Mixología","Hielo","Bull/Energy","COSTCO (bar)","Seltzers","Otro bar"];
const PROVEEDORES_COCINA=["Abarrotes","Frutería","Pescadería","COSTCO (cocina)","ISLAS","RVFOODS","SMART","Michoacana","Lucky","Superchivas","La Bodega","Panadería","Gas Pizza","Calimax","Carnitas M.Pueblo","FENER","Agua","Otro cocina"];
const PROVEEDORES_COMP=["Gas","Mantenimiento","Limpieza","Publicidad","Contabilidad","Otro compartido"];

// Conceptos gastos fijos (del Excel formato-gastos-ingresos)
const GASTOS_CONCEPTOS=[
  {concepto:"Renta",                area:"compartido"},
  {concepto:"Predial",              area:"compartido"},
  {concepto:"Permiso Alcohol",      area:"bar"},
  {concepto:"Luz",                  area:"compartido"},
  {concepto:"Agua",                 area:"compartido"},
  {concepto:"Gas",                  area:"compartido"},
  {concepto:"Internet",             area:"compartido"},
  {concepto:"ECOMNGMT",             area:"bar"},
  {concepto:"Srv. Alarma",          area:"compartido"},
  {concepto:"Mantenimiento",        area:"compartido"},
  {concepto:"Limpieza",             area:"compartido"},
  {concepto:"Publicidad",           area:"bar"},
  {concepto:"Contabilidad",         area:"compartido"},
  {concepto:"Suscripciones",        area:"compartido"},
  {concepto:"Art. Oficina Bar",     area:"bar"},
];

function ComingSoon({modulo,subgrupos}){return(
  <div style={{display:"flex",flexDirection:"column",gap:16}}>
    <div style={{background:C.s2,border:"1px dashed "+C.border,borderRadius:12,padding:"32px 24px",textAlign:"center"}}>
      <div style={{fontSize:32,marginBottom:12}}>🚧</div>
      <div style={{fontSize:16,fontWeight:700,color:C.ink,marginBottom:6}}>{modulo}</div>
      <div style={{fontSize:11,color:C.ink4,marginBottom:20}}>Módulo en desarrollo · Fase 2</div>

        {subgrupos.map((s,i)=><span key={i} style={{padding:"4px 12px",borderRadius:20,background:C.s3,border:"1px solid "+C.border,fontSize:9,color:C.ink3}}>{s}</span>)}

// ── SIDEBAR NAV ───────────────────────────────────────────────────────────────
const NAV=[
  {id:"dashboard",label:"Dashboard Ejecutivo",icon:"◈",group:null},
  {group:"OPERACIONES"},
  {id:"nomina",   label:"Nómina",             icon:"◉",parent:"nomina_prop"},
  {id:"propinas", label:"Propinas",            icon:"✦",parent:"nomina_prop"},
  {id:"asistencias",label:"Asistencias",       icon:"◷"},
  {id:"ventas",   label:"Ventas",              icon:"◆"},
  {id:"empleados",label:"Empleados",           icon:"👤"},
  {group:"FINANZAS"},
  {id:"compras",  label:"Compras",             icon:"🛒"},
  {id:"inventarios",label:"Inventarios",       icon:"📦"},
  {id:"balance",  label:"Balance General",     icon:"⚖"},
  {id:"costeos",  label:"Costeos",             icon:"🧮"},
  {group:"DOCUMENTOS"},
  {id:"tickets",  label:"Tickets",             icon:"🧾"},
  {id:"facturas", label:"Facturas",            icon:"📋"},

function Sidebar({tab,setTab,collapsed,setCollapsed}){
  const W=collapsed?52:200;
  return(
    <div style={{width:W,minHeight:"100vh",background:C.surface,borderRight:"1px solid "+C.border,display:"flex",flexDirection:"column",transition:"width .2s",flexShrink:0,overflow:"hidden"}}>
      {/* Logo */}
      <div style={{padding:"16px 14px",display:"flex",alignItems:"center",gap:10,borderBottom:"1px solid "+C.border,cursor:"pointer"}} onClick={()=>setCollapsed(!collapsed)}>
        <div style={{width:24,height:24,borderRadius:6,background:C.green+"22",border:"1px solid "+C.greenDim,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <span style={{fontSize:10,color:C.green,fontWeight:800}}>B</span>
        </div>
        {!collapsed&&<div>
          <div style={{fontSize:12,fontWeight:800,color:C.green,lineHeight:1}}>BarHub</div>
          <div style={{fontSize:7,color:C.ink4,lineHeight:1.4}}>Soja Restoran</div>
        </div>}

      </div>
      {/* Nav */}
      <div style={{flex:1,overflowY:"auto",padding:"8px 0"}}>
        {NAV.map((item,i)=>{
          if(item.group)return collapsed?<div key={i} style={{height:1,background:C.border,margin:"4px 8px"}}/>:<div key={i} style={{padding:"10px 14px 4px",fontSize:7,letterSpacing:"0.12em",textTransform:"uppercase",color:C.ink4,fontWeight:700}}>{item.group}</div>;
          const active=tab===item.id;
          return(
            <button key={i} onClick={()=>setTab(item.id)} title={collapsed?item.label:""} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:collapsed?"10px 0":"8px 14px",justifyContent:collapsed?"center":"flex-start",background:active?C.green+"15":"none",border:"none",borderLeft:active?"2px solid "+C.green:"2px solid transparent",color:active?C.green:C.ink3,fontSize:11,cursor:"pointer",transition:"all .15s"}}>
              <span style={{fontSize:12,flexShrink:0}}>{item.icon}</span>
              {!collapsed&&<span style={{fontWeight:active?600:400}}>{item.label}</span>}
            </button>

      </div>
      {/* Footer */}
      {!collapsed&&<div style={{padding:"10px 14px",borderTop:"1px solid "+C.border,fontSize:8,color:C.ink4}}>

}

// ── PERIOD SELECTOR ──────────────────────────────────────────────────────────
// Panel Año/Mes/Semana: lista las semanas de un mes (desde /semanas-disponibles)
// con indicadores de qué datos tiene cada una, para saltar directo a cualquiera.
function SemanaPicker({semana,onJump,onClose}){
  const [anio,setAnio]=useState(semana.dom.getFullYear());
  const [mes,setMes]=useState(semana.dom.getMonth()+1);
  const [semanas,setSemanas]=useState([]);
  const [loading,setLoading]=useState(false);

  useEffect(()=>{
    let cancel=false;
    setLoading(true);
    fetch(API+"/api/dashboard/semanas-disponibles?anio="+anio+"&mes="+mes)
      .then(r=>r.json()).then(d=>{if(!cancel&&d.ok)setSemanas(d.semanas||[]);})
      .catch(()=>{if(!cancel)setSemanas([]);})
      .finally(()=>{if(!cancel)setLoading(false);});
    return()=>{cancel=true;};
  },[anio,mes]);

  const dot=(on,c)=>({width:6,height:6,borderRadius:"50%",background:on?c:C.ink4,flexShrink:0});
  const navBtn={width:22,height:22,borderRadius:5,border:"1px solid "+C.border,background:C.s3,color:C.ink3,cursor:"pointer",fontSize:12};

  return(<>
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:60}}/>
    <div onClick={e=>e.stopPropagation()} style={{position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:61,background:C.surface,border:"1px solid "+C.border,borderRadius:10,padding:12,width:270,boxShadow:"0 10px 28px rgba(0,0,0,.35)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <button onClick={()=>setAnio(a=>a-1)} style={navBtn}>‹</button>
        <span style={{fontSize:12,fontWeight:700,color:C.ink}}>{anio}</span>
        <button onClick={()=>setAnio(a=>a+1)} style={navBtn}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4,marginBottom:10}}>
        {MESES.map((m,i)=>(
          <button key={i} onClick={()=>setMes(i+1)} style={{padding:"4px 0",borderRadius:5,border:"1px solid "+(mes===i+1?C.green:C.border),background:mes===i+1?C.green+"18":C.s3,color:mes===i+1?C.green:C.ink3,fontSize:8,fontWeight:mes===i+1?700:400,cursor:"pointer"}}>{m.slice(0,3)}</button>
        ))}
      </div>
      <div style={{maxHeight:220,overflowY:"auto",display:"flex",flexDirection:"column",gap:4}}>
        {loading&&<div style={{fontSize:9,color:C.ink4,textAlign:"center",padding:10}}>Cargando…</div>}
        {!loading&&semanas.length===0&&<div style={{fontSize:9,color:C.ink4,textAlign:"center",padding:10}}>Sin semanas este mes</div>}
        {!loading&&semanas.map((s,i)=>{
          const active=s.selectorKey===semana.key;
          return(
            <button key={i} onClick={()=>onJump(s.domSab.inicio)}
              style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 9px",borderRadius:6,border:"1px solid "+(active?C.green:C.border),background:active?C.green+"12":C.s3,color:active?C.green:C.ink2,fontSize:9,fontWeight:active?700:400,cursor:"pointer",textAlign:"left"}}>
              <span>{s.domSab.inicio.slice(5)} – {s.domSab.fin.slice(5)}</span>
              <span style={{display:"flex",gap:3}}>
                <span title="Asistencias" style={dot(s.tieneAsistencias,C.amber)}/>
                <span title="Ventas" style={dot(s.tieneVentas,C.blue)}/>
                <span title="Grupos" style={dot(s.tieneGrupos,C.teal)}/>
              </span>
            </button>
          );
        })}
      </div>
    </div>
  </>);
}

function PeriodSelector({semana,onPrev,onNext,onToday,onJump,isToday,mobile}){
  const btnSz=mobile?28:22;
  const [open,setOpen]=useState(false);
  return(
    <div style={{position:"relative",display:"flex",alignItems:"center",gap:mobile?4:6}}>
      <button onClick={onPrev} style={{width:btnSz,height:btnSz,borderRadius:4,border:"1px solid "+C.border,background:C.s2,color:C.ink3,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
      <button onClick={()=>setOpen(o=>!o)} style={{background:C.s2,border:"1px solid "+(open?C.green:C.border),borderRadius:6,padding:mobile?"4px 10px":"3px 10px",fontSize:mobile?10:9,color:C.ink,fontFamily:"monospace",minWidth:mobile?120:140,textAlign:"center",cursor:"pointer"}}>
        {!mobile&&<span style={{color:C.ink4}}>{MESES[semana.dom.getMonth()]} {semana.dom.getFullYear()} · </span>}
        {mobile&&<span style={{color:C.ink4,fontSize:8}}>{semana.key.slice(5,10)} </span>}
        {semana.label}
      </button>
      <button onClick={onNext} style={{width:btnSz,height:btnSz,borderRadius:4,border:"1px solid "+C.border,background:C.s2,color:C.ink3,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
      {!isToday&&<button onClick={onToday} style={{padding:"2px 8px",borderRadius:4,border:"1px solid "+C.greenDim,background:"none",color:C.green,cursor:"pointer",fontSize:8}}>Hoy</button>}
      {open&&<SemanaPicker semana={semana} onJump={d=>{onJump(d);setOpen(false);}} onClose={()=>setOpen(false)}/>}
    </div>
  );
}

// ── KPI DRILL-DOWN ───────────────────────────────────────────────────────────
function KpiDrillDown({kpi,rows,data,ventasProp,onClose}){
  const ventasActual=data.ventas||[];
  const src=ventasProp&&ventasProp.length?ventasProp:ventasActual;
  const titles={"ventas":"Ventas por mesero","nomina":"Detalle nómina","propinas":"Propinas tarjeta","sueldos":"Sueldos por empleado"};
  return(
    <div style={{background:C.s2,border:"1px solid "+C.border,borderRadius:10,padding:"14px 16px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <span style={{fontSize:8,fontWeight:700,letterSpacing:"0.13em",textTransform:"uppercase",color:C.ink4}}>{titles[kpi]}</span>
        <button onClick={onClose} style={{background:"none",border:"none",color:C.ink4,fontSize:14,cursor:"pointer",padding:"0 4px"}}>✕</button>
      </div>
      {kpi==="ventas"&&<table style={{width:"100%",borderCollapse:"collapse"}}>
        <TH cols={["Mesero","Venta","Prop. Tarjeta"]}/>
        <tbody>
          {ventasActual.map((m,i)=>{
            const sp=src.find(p=>p.nombre?.toLowerCase()===m.nombre?.toLowerCase());
            const pt=sp?.propina??sp?.prop_tarjeta??0;
            return <tr key={i} style={{borderBottom:"1px solid "+C.border}}>
              <td style={{padding:"7px 10px"}}><div style={{display:"flex",alignItems:"center",gap:6}}><Av n={m.nombre} c={C.blue} size={20}/><span style={{fontSize:10,fontWeight:600}}>{m.nombre}</span></div></td>
              <td style={{padding:"7px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.green,fontWeight:700}}>{mxnD(m.venta||0)}</td>
              <td style={{padding:"7px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.teal}}>{pt>0?mxnD(pt):"-"}</td>
            </tr>;
          })}
        </tbody>
      </table>}
      {kpi==="nomina"&&<table style={{width:"100%",borderCollapse:"collapse"}}>

// ── DASHBOARD EJECUTIVO ───────────────────────────────────────────────────────
function TabDashboard({data,semana,nomina,ventasProp,grupos,setTab,mobile}){
  const [activeKpi,setActiveKpi]=useState(null);
  const rows=nomina?.rows||[];
  const nomTotal=nomina?.totales?.totalNeto||0;
  const nomSueldos=nomina?.totales?.sueldo||0;
  const ventasTotal=(grupos||[]).filter(g=>!g.es_subgrupo).reduce((a,g)=>a+(g.venta||0),0)||(data.ventas||[]).reduce((a,m)=>a+(m.venta||0),0);
  const propTotal=ventasProp&&ventasProp.length?ventasProp.reduce((a,m)=>a+(m.propina??m.prop_tarjeta??0),0):0;
  const comprasTotal=(data.compras||[]).reduce((a,c)=>a+(c.monto||0),0);
  const gastosFijosSemanales=(data.gastosFijos||[]).reduce((a,g)=>a+(g.monto||0),0)/4.33;
  const utilidad=ventasTotal-nomTotal-comprasTotal-gastosFijosSemanales;
  const margenPct=ventasTotal>0?utilidad/ventasTotal*100:0;
  const toggle=id=>setActiveKpi(a=>a===id?null:id);
  const cols=mobile?"repeat(2,1fr)":"repeat(4,1fr)";

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {/* Hero */}
      <div style={{background:"linear-gradient(135deg,"+C.s2+" 0%,"+C.s3+" 100%)",border:"1px solid "+C.greenDim,borderRadius:12,padding:mobile?"14px 16px":"20px 24px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontSize:8,letterSpacing:"0.13em",textTransform:"uppercase",color:C.ink4,marginBottom:4}}>Semana</div>
          <div style={{fontSize:mobile?16:22,fontWeight:800,color:C.green}}>Soja Restoran</div>
          <div style={{fontSize:9,color:C.ink3,marginTop:2}}>Dashboard Ejecutivo</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:8,color:C.ink4,marginBottom:2}}>Venta semanal</div>
          <div style={{fontSize:mobile?20:28,fontWeight:800,color:C.green,fontFamily:"monospace"}}>{mxnD(ventasTotal)}</div>
          <div style={{fontSize:9,color:C.ink4}}>Nómina: {mxnD(nomTotal)}</div>
        </div>
      </div>

      {/* KPIs — 2 cols en mobile, 4 en desktop */}
      <div style={{display:"grid",gridTemplateColumns:cols,gap:mobile?8:10}}>
        <KPI label="Ventas"        value={mxnD(ventasTotal)} color={C.green}  onClick={()=>toggle("ventas")}   active={activeKpi==="ventas"}/>
        <KPI label="Nómina neta"   value={mxnD(nomTotal)}    color={C.purple} onClick={()=>toggle("nomina")}   active={activeKpi==="nomina"}/>
        <KPI label="Prop. tarjeta" value={mxnD(propTotal)}   sub="sem anterior" color={C.teal} onClick={()=>toggle("propinas")} active={activeKpi==="propinas"}/>
        <KPI label="Sueldos"       value={mxnD(nomSueldos)}  color={C.blue}   onClick={()=>toggle("sueldos")}  active={activeKpi==="sueldos"}/>
      </div>

      {/* Drill-down panel */}
      {activeKpi&&<KpiDrillDown kpi={activeKpi} rows={rows} data={data} ventasProp={ventasProp} onClose={()=>setActiveKpi(null)}/>}

      {/* Mini P&L — Estado de Resultados rápido */}
      <div onClick={()=>setTab&&setTab("balance")} style={{background:C.s2,border:"1px solid "+C.border,borderRadius:10,padding:"12px 16px",cursor:"pointer"}}
        onMouseEnter={e=>e.currentTarget.style.borderColor=C.blue}
        onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontSize:9,fontWeight:700,color:C.ink4,textTransform:"uppercase",letterSpacing:"0.1em"}}>Estado de Resultados · Esta semana</div>
          <div style={{fontSize:8,color:C.blue}}>Ver detalle →</div>
        </div>
        {[
          {label:"(+) Ventas",          val:ventasTotal,            color:C.green,  neg:false},
          {label:"(−) Nómina",          val:nomTotal,               color:C.purple, neg:true},
          {label:"(−) Compras",         val:comprasTotal,           color:C.amber,  neg:true},
          {label:"(−) Gastos fijos",    val:gastosFijosSemanales,   color:C.ink3,   neg:true},
        ].map((r,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:"1px solid "+C.border}}>
            <span style={{fontSize:10,color:C.ink3}}>{r.label}</span>
            <span style={{fontSize:11,fontFamily:"monospace",fontWeight:600,color:r.neg?C.ink3:r.color}}>{r.neg?"("+mxnD(r.val)+")":mxnD(r.val)}</span>
          </div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}}>
          <span style={{fontSize:11,fontWeight:800,color:C.ink}}>Utilidad neta</span>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:16,fontWeight:800,fontFamily:"monospace",color:utilidad>=0?C.green:C.red}}>{mxnD(Math.abs(utilidad))}{utilidad<0?" ▼":" ▲"}</div>
            <div style={{fontSize:9,color:C.ink4}}>Margen {margenPct.toFixed(1)}%</div>
          </div>
        </div>
      </div>

      {/* Módulos — 1 col en mobile, 2 en desktop */}
      <div style={{display:"grid",gridTemplateColumns:mobile?"1fr":"repeat(2,1fr)",gap:10}}>
        {[
          {label:"Nómina & Propinas",icon:"◉",value:mxnD(nomTotal),   sub:"Total a pagar",  color:C.purple,ok:true, navTo:"nomina"},
          {label:"Ventas",           icon:"◆",value:mxnD(ventasTotal), sub:"Venta semanal",  color:C.green, ok:ventasTotal>0,navTo:"ventas"},
          {label:"Compras",          icon:"🛒",value:mxnD(comprasTotal),sub:"Gasto semanal",  color:C.amber, ok:true, navTo:"compras"},
          {label:"Balance General",  icon:"⚖",value:mxnD(utilidad),   sub:"Utilidad semanal",color:utilidad>=0?C.green:C.red,ok:true,navTo:"balance"},
          {label:"Inventarios",      icon:"📦",value:"Próx.",           sub:"En desarrollo",  color:C.orange,ok:false,navTo:null},
          {label:"Costeos",          icon:"🧮",value:"Próx.",           sub:"En desarrollo",  color:C.teal,  ok:false,navTo:null},
        ].map((m,i)=>(
          <div key={i}
            onClick={()=>m.ok&&m.navTo&&setTab&&setTab(m.navTo)}
            onMouseEnter={e=>{if(m.ok&&m.navTo)e.currentTarget.style.borderColor=m.color;}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;}}
            style={{background:C.s2,border:"1px solid "+C.border,borderRadius:8,padding:"11px 14px",display:"flex",alignItems:"center",gap:10,opacity:m.ok?1:0.5,cursor:m.ok&&m.navTo?"pointer":"default",transition:"border-color .15s"}}>
            <div style={{width:34,height:34,borderRadius:8,background:m.color+"15",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>{m.icon}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:8,color:C.ink4,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:2}}>{m.label}</div>
              <div style={{fontSize:14,fontWeight:700,color:m.ok?m.color:C.ink4,fontFamily:"monospace"}}>{m.value}</div>
            </div>
            {m.ok&&m.navTo&&<span style={{fontSize:10,color:C.ink4}}>›</span>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── TAB PROPINAS ──────────────────────────────────────────────────────────────
// Consume /api/propinas/:semana (mismo motor y tablas que Nómina) — editable y
// persistente, sin overrides de sesión.
function TabPropinas({data,semana,propinas,reloadNomina}){
  const ventasActual=data.ventas||[];
  const propTarjeta=propinas?.propTarjeta||[];
  const reparto=propinas?.reparto||{totalMoche:0,totalRepartido:0,sobrante:0,empleados:[]};
  const tm=reparto.totalMoche;
  const tBruto=propTarjeta.reduce((a,r)=>a+(r.propTarjetaBruto||0),0);
  const tNeto=propTarjeta.reduce((a,r)=>a+(r.propTarjeta||0),0);
  const edit=(nombre,patch)=>putNomina("propinas",semana.key,nombre,patch).then(reloadNomina);
  // Todos los meseros que aparecieron en ventas actuales o en el reparto de propinas
  const todos=[...ventasActual];
  propTarjeta.forEach(p=>{if(!todos.some(m=>m.nombre?.toLowerCase()===p.nombre?.toLowerCase()))todos.push({nombre:p.nombre,venta:0});});
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
        <KPI label="Moche 4.5%" value={mxn(tm)} color={C.red}/>
        <KPI label="Propinas tarjeta (bruto)" value={mxnD(tBruto)} sub={propinas?.semanaPropinas||"sem anterior"} color={C.teal}/>
        <KPI label="Neto (−8% terminal)" value={mxnD(tNeto)} color={C.green}/>
      </div>
      <Card title={"Propinas tarjeta · "+(propinas?.semanaPropinas||"sem anterior")}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <TH cols={["Mesero","Venta actual","Moche","Prop. bruto","−8%","Neto"]}/>
          <tbody>
            {todos.map((m,i)=>{
              const r=propTarjeta.find(p=>p.nombre?.toLowerCase()===m.nombre?.toLowerCase());
              const moche=r?.moche||0, neto=r?.propTarjeta||0, bruto=r?.propTarjetaBruto||0, co=bruto-neto;
              return(
                <tr key={i} style={{borderBottom:"1px solid "+C.border,background:i%2===0?"transparent":C.s3+"60"}}>
                  <td style={{padding:"10px"}}><div style={{display:"flex",alignItems:"center",gap:8}}><Av n={m.nombre} c={C.blue}/><span style={{fontSize:11,fontWeight:600}}>{m.nombre}</span></div></td>
                  <td style={{padding:"10px",textAlign:"right",fontSize:12,fontFamily:"monospace",color:C.ink2}}>{mxnD(m.venta||0)}</td>
                  <td style={{padding:"10px",textAlign:"right"}}><EditNum value={r?.overrides?.moche??(moche||null)} width={72} color={C.red} onSave={v=>edit(m.nombre,{moche:v})}/></td>
                  <td style={{padding:"10px",textAlign:"right"}}><EditNum value={r?.overrides?.propTarjeta??(bruto||null)} width={72} color={C.teal} onSave={v=>edit(m.nombre,{propTarjeta:v})}/></td>
                  <td style={{padding:"10px",textAlign:"right",fontSize:12,fontFamily:"monospace",color:C.red}}>{co>0?"("+mxnD(co)+")":"-"}</td>
                  <td style={{padding:"10px",textAlign:"right",fontSize:13,fontFamily:"monospace",fontWeight:800,color:neto>0?C.green:C.ink4}}>{neto>0?mxnD(neto):"—"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Card>
      <Card title={"Reparto a piso · "+mxnD(tm)+" total"}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <TH cols={["Empleado","Área","Hrs Prog","Hrs Real","A Cobrar"]}/>
          <tbody>
            {reparto.empleados.map((p,i)=>{const col=AREA_COLOR[p.area]||C.ink4;return(
              <tr key={i} style={{borderBottom:"1px solid "+C.border,background:i%2===0?"transparent":C.s3+"60"}}>
                <td style={{padding:"10px"}}><div style={{display:"flex",alignItems:"center",gap:8}}><Av n={p.nombre} c={col}/><span style={{fontSize:11,fontWeight:600}}>{p.nombre}</span></div></td>
                <td style={{padding:"10px"}}><Badge label={p.area} color={col} bg={col+"15"}/></td>
                <td style={{padding:"10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.ink3}}>{p.hrsProg}h</td>
                <td style={{padding:"10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:p.hrsReal<p.hrsProg?C.amber:C.green}}>{p.hrsReal}h</td>
                <td style={{padding:"10px",textAlign:"right"}}><EditNum value={p.overrides?.propPiso??(p.ajuste||null)} width={80} color={C.blue} onSave={v=>edit(p.nombre,{propPiso:v})}/></td>
              </tr>
            );})}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

// ── TAB ASISTENCIAS ─────────────────────────────────────────────────────────
const MESES_CORTO=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

function parseSemana(key){
  var parts=key.split("_a_");
  var dom=new Date(parts[0]+"T12:00:00");
  var sab=new Date(parts[1]+"T12:00:00");
  return {key:key,dom:dom,sab:sab,mes:dom.getMonth(),anio:dom.getFullYear(),
    label:dom.getDate()+" "+MESES_CORTO[dom.getMonth()]+" – "+sab.getDate()+" "+MESES_CORTO[sab.getMonth()]};
}

function BarCump({pct}){
  var color=pct>=90?C.green:pct>=70?C.amber:C.red;
  return <div style={{display:"flex",alignItems:"center",gap:5}}>
    <div style={{width:60,height:5,background:C.s3,borderRadius:3}}>
      <div style={{width:Math.min(pct,100)+"%",height:"100%",background:color,borderRadius:3}}/>
    </div>
    <span style={{fontSize:8,fontFamily:"monospace",color:color}}>{pct.toFixed(0)}%</span>
  </div>;
}

function EstBadge({hb,hp,adminFijo}){
  if(adminFijo) return <Badge label="Admin" color={C.purple} bg={C.purple+"15"}/>;
  if(!hb&&hb!==0) return <Badge label="Sin datos" color={C.ink4} bg={C.s3}/>;
  if(hb===0) return <Badge label="No asistió" color={C.red} bg={C.red+"15"}/>;
  if(hb>=hp*.9) return <Badge label="✓ Completo" color={C.green} bg={C.green+"15"}/>;
  return <Badge label="Parcial" color={C.amber} bg={C.amber+"15"}/>;
}

function TabAsistencias({data,semana,porSemanaHistorial,loadingHistorial,anioHistorial,empleados}){
  const [vista,setVista]=useState("semana");
  const [empSel,setEmpSel]=useState("Angel");
  const [mesSel,setMesSel]=useState(new Date().getMonth());
  const asist=data.asistencias||[];
  const historial=porSemanaHistorial||{};

  var VISTAS=[
    {id:"semana",label:"Semana",icon:"📅"},
    {id:"mes",label:"Mes",icon:"🗓"},
    {id:"empleado",label:"Empleado",icon:"👤"},
    {id:"anual",label:"Anual",icon:"📊"},
  ];

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div style={{display:"flex",gap:0,background:C.s2,borderRadius:8,border:"1px solid "+C.border,overflow:"hidden",alignSelf:"flex-start"}}>
      {VISTAS.map(function(v){return(
        <button key={v.id} onClick={function(){setVista(v.id);}} style={{padding:"8px 14px",background:vista===v.id?C.green+"20":"none",border:"none",borderRight:"1px solid "+C.border,color:vista===v.id?C.green:C.ink4,fontSize:10,cursor:"pointer",fontWeight:vista===v.id?700:400}}>
          {v.icon} {v.label}
        </button>
      );})}
      {vista==="mes"&&<select value={mesSel} onChange={function(e){setMesSel(Number(e.target.value));}} style={{padding:"8px 10px",background:C.s3,border:"none",borderLeft:"1px solid "+C.border,color:C.ink,fontSize:10}}>
        {MESES.map(function(m,i){return <option key={i} value={i}>{m}</option>;})}

    {vista==="semana"&&<AsistSemana asist={asist} semana={semana} empleados={empleados}/>}
    {vista==="mes"&&<AsistMes historial={historial} mesSel={mesSel} anio={anioHistorial} loading={loadingHistorial} empleados={empleados}/>}
    {vista==="empleado"&&<AsistEmpleado historial={historial} empSel={empSel} setEmpSel={setEmpSel} anio={anioHistorial} loading={loadingHistorial} empleados={empleados}/>}
    {vista==="anual"&&<AsistAnual historial={historial} anio={anioHistorial} loading={loadingHistorial} empleados={empleados}/>}
  </div>;

function AsistSemana({asist,semana,empleados}){
  var presentes=asist.length;
  var totalHrs=asist.reduce(function(a,e){return a+(e.horas_reales||0);},0);
  var completos=asist.filter(function(e){
    var emp=empleados.find(function(b){return b.nombre.toLowerCase()===(e.nombre||"").toLowerCase();});
    return emp&&(e.horas_reales||0)>=emp.hrsProg*.9;
  }).length;
  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
      <KPI label="Empleados presentes" value={presentes} color={C.green}/>
      <KPI label="Completos (90%)" value={completos} color={C.blue}/>
      <KPI label="Total horas" value={totalHrs+"h"} color={C.purple}/>
      <KPI label="Ausentes" value={(empleados.filter(function(e){return !e.adminFijo;}).length-asist.filter(function(e){return e.nombre!=="Andrea"&&e.nombre!=="Gerardo";}).length)+" emp."} color={C.red}/>
    </div>
    <Card title={"Detalle semana · "+semana.label}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <TH cols={["Empleado","Área","Hrs Prog","Hrs Reales","Días","Cumplimiento","Estado"]}/>
        <tbody>
          {empleados.map(function(emp,i){
            var a=asist.find(function(x){return (x.nombre||"").toLowerCase()===emp.nombre.toLowerCase();});
            var hb=a?(a.horas_reales||0):0;
            var p=emp.hrsProg>0?(hb/emp.hrsProg*100):0;
            var col=AREA_COLOR[emp.area]||C.ink4;
            return <tr key={i} style={{borderBottom:"1px solid "+C.border,background:i%2===0?"transparent":C.s3+"60"}}>
              <td style={{padding:"9px 10px"}}><div style={{display:"flex",alignItems:"center",gap:8}}><Av n={emp.nombre} c={col}/><span style={{fontSize:11,fontWeight:600}}>{emp.nombre}</span></div></td>
              <td style={{padding:"9px 10px"}}><Badge label={emp.area} color={col} bg={col+"15"}/></td>
              <td style={{padding:"9px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.ink3}}>{emp.adminFijo?"—":emp.hrsProg+"h"}</td>
              <td style={{padding:"9px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:a?C.ink:C.ink4}}>{emp.adminFijo?"Fijo":a?hb+"h":"—"}</td>
              <td style={{padding:"9px 10px",textAlign:"right",fontSize:11,fontFamily:"monospace",color:C.ink3}}>{emp.adminFijo?"5":a?(a.dias_asistidos||0):"—"}</td>
              <td style={{padding:"9px 10px"}}>{emp.adminFijo?<span style={{fontSize:9,color:C.ink4}}>N/A</span>:<BarCump pct={p}/>}</td>
              <td style={{padding:"9px 10px",textAlign:"right"}}><EstBadge hb={hb} hp={emp.hrsProg} adminFijo={emp.adminFijo}/></td>
            </tr>;
          })}
        </tbody>
      </table>
    </Card>
  </div>;
}

  var emps=empleados.filter(function(e){return !e.adminFijo;});
  return <Card title={"Asistencias · "+MESES[mesSel]+" "+anio}>

          {semanas.map(function(s,i){var sem=parseSemana(s);return <th key={i} style={{padding:"8px 8px",textAlign:"center",fontSize:7,color:C.ink4,borderBottom:"1px solid "+C.border,minWidth:70}}>Sem {i+1}<div style={{fontSize:6,color:C.ink4,marginTop:2}}>{sem.label}</div></th>;})}
          <th style={{padding:"8px 10px",textAlign:"right",fontSize:7,fontWeight:700,color:C.ink4,borderBottom:"1px solid "+C.border}}>Total</th>
        </tr></thead>
        <tbody>
          {emps.map(function(emp,i){
            var col=AREA_COLOR[emp.area]||C.ink4;
            var totalHrs=0;
            return <tr key={i} style={{borderBottom:"1px solid "+C.border,background:i%2===0?"transparent":C.s3+"60"}}>

              {semanas.map(function(s,j){
                var reg=(historial[s]||[]).find(function(r){return (r.nombre||"").toLowerCase()===emp.nombre.toLowerCase();});
                var hb=reg?(reg.horas_reales||0):null;
                var p=hb!=null?Math.min(100,hb/emp.hrsProg*100):null;
                if(hb!=null) totalHrs+=hb;
                var bg=hb==null?C.s3:p>=90?C.green+"22":p>=70?C.amber+"22":C.red+"22";
                var tc=hb==null?C.ink4:p>=90?C.green:p>=70?C.amber:C.red;
                return <td key={j} style={{padding:"6px"}}><div style={{background:bg,borderRadius:5,padding:"4px 2px",textAlign:"center",minWidth:60}}>
                  <div style={{fontSize:11,fontFamily:"monospace",fontWeight:700,color:tc}}>{hb!=null?hb+"h":"—"}</div>
                  <div style={{fontSize:7,color:tc}}>{p!=null?p.toFixed(0)+"%":""}</div>
                </div></td>;
              })}
              <td style={{padding:"8px 10px",textAlign:"right",fontSize:12,fontFamily:"monospace",fontWeight:700,color:C.green}}>{totalHrs>0?totalHrs+"h":"—"}</td>
            </tr>;
          })}
        </tbody>
      </table>
